services:
  narrafork-go:
    build:
      context: .
      dockerfile: Containerfile.go
    image: narrafork-go:local
    container_name: narrafork-go
    ports:
      - "${NF_GO_PORT:-7789}:7778"
    volumes:
      # 新 named volume：不复用宿主机 ~/.narrafork，也不复用现有 narrafork-data。
      - narrafork-go-data:/root/.narrafork
    environment:
      HOST: 0.0.0.0
      PORT: 7778
      NARRAFORK_FRONTEND_DIR: /app/dist/frontend
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    restart: unless-stopped

volumes:
  narrafork-go-data:
