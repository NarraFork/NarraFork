name: remote-executor
# Protected GitHub helper/executor publication lives in helpers-release.yml.
# This automatic integration workflow remains build-only with no remote writes.

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - "remote-executor/**"
      - "server/db/schema.ts"
      - "server/lib/agent/execution/**"
      - "server/lib/validators/devices.ts"
      - "server/lib/validators/websocket.ts"
      - "server/routes/devices.ts"
      - "server/services/device-*.ts"
      - "server/services/terminal-service.ts"
      - "server/terminal/**"
      - "server/websocket/terminal-ws.ts"
      - "frontend/lib/api/devices.ts"
      - "frontend/routes/settings/devices.tsx"
      - "frontend/locales/*/settings.json"
      - "shared/remote-executor.ts"
      - "shared/remote-executor-manifest.ts"
      - "server/lib/executor-*.ts"
      - "server/routes/executor-bootstrap.ts"
      - "frontend/components/settings/ExecutorInstallModal.tsx"
      - "frontend/lib/device-config.ts"
      - "scripts/release-executor.ts"
      - "scripts/lib/executor-manifest.ts"
      - "scripts/lib/helper-*.ts"
      - "scripts/release-helpers.ts"
      - "shared/helper-distribution.ts"
      - ".github/workflows/helpers-release.yml"
      - "update-server/routes/tools.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/remote-executor.yml"
  pull_request:
    paths:
      - "remote-executor/**"
      - "server/db/schema.ts"
      - "server/lib/agent/execution/**"
      - "server/lib/validators/devices.ts"
      - "server/lib/validators/websocket.ts"
      - "server/routes/devices.ts"
      - "server/services/device-*.ts"
      - "server/services/terminal-service.ts"
      - "server/terminal/**"
      - "server/websocket/terminal-ws.ts"
      - "frontend/lib/api/devices.ts"
      - "frontend/routes/settings/devices.tsx"
      - "frontend/locales/*/settings.json"
      - "shared/remote-executor.ts"
      - "shared/remote-executor-manifest.ts"
      - "server/lib/executor-*.ts"
      - "server/routes/executor-bootstrap.ts"
      - "frontend/components/settings/ExecutorInstallModal.tsx"
      - "frontend/lib/device-config.ts"
      - "scripts/release-executor.ts"
      - "scripts/lib/executor-manifest.ts"
      - "scripts/lib/helper-*.ts"
      - "scripts/release-helpers.ts"
      - "shared/helper-distribution.ts"
      - ".github/workflows/helpers-release.yml"
      - "update-server/routes/tools.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/remote-executor.yml"

jobs:
  executor-go:
    name: Go tests, vet, and cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.24.13
          cache: true
          cache-dependency-path: remote-executor/go.sum
          check-latest: false

      - name: Check Go formatting
        working-directory: remote-executor
        run: test -z "$(gofmt -l .)"

      - name: Run Go tests
        working-directory: remote-executor
        run: go test ./...

      - name: Run Go vet
        working-directory: remote-executor
        run: go vet ./...

      - name: Build all executor platforms
        working-directory: remote-executor
        run: make dist VERSION=ci-test COMMIT="${GITHUB_SHA::12}" BUILD_TIME=1970-01-01T00:00:00Z

      - name: Verify injected version
        working-directory: remote-executor
        run: |
          make build VERSION=ci-test COMMIT="${GITHUB_SHA::12}" BUILD_TIME=1970-01-01T00:00:00Z
          case "$(./narrafork-executor --version)" in
            *ci-test*) ;;
            *) echo "version metadata was not injected"; exit 1 ;;
          esac

      # The distribution pipeline is only exercised on real artifacts, so build the
      # publishable set here (dry run: digests and manifest only, no upload).
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Verify executor release pipeline
        run: bun scripts/release-executor.ts 0.0.0-ci --dry-run

      - name: Upload executor binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: narrafork-executor-${{ github.sha }}
          path: |
            remote-executor/dist/narrafork-executor-*
          retention-days: 14
          if-no-files-found: error

  executor-native-files:
    name: Native conditional replacement (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm, macos-26-intel, macos-26]
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        working-directory: remote-executor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.24.13
          cache: true
          cache-dependency-path: remote-executor/go.sum
          check-latest: false
      # Cross-builds cannot exercise Win32 permission merges or Darwin ACL APIs.
      # Windows tests also impersonate a restricted token: hosted Windows runners
      # run as administrators, which must not mask ordinary-user failures.
      - name: Run native filesystem and cancellation regressions
        run: go test -count=1 -timeout=5m ./internal/handlers ./internal/rpc -run "Conditional|Metadata|FileMutation|Windows|Darwin"
      - name: Check native Go code
        run: go vet ./internal/handlers ./internal/rpc

  integration-typescript:
    name: TypeScript, Bun tests, and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: Install VS Code extension type dependencies
        run: bun install --cwd vscode-extension --frozen-lockfile

      - name: Check TypeScript
        run: bunx tsgo --noEmit

      - name: Check changed integration files
        run: >-
          bunx @biomejs/biome check
          server/db/schema.ts
          server/services/device-transfer-service.ts
          server/services/__tests__/device-transfer-tasks.test.ts
          server/services/terminal-service.ts
          server/terminal/runtime-remote.ts
          server/terminal/runtime-remote.test.ts
          server/routes/devices.ts
          frontend/lib/api/devices.ts
          frontend/routes/settings/devices.tsx
          frontend/locales/en/settings.json
          frontend/locales/zh-CN/settings.json

      - name: Run remote execution integration tests
        run: >-
          bun test --isolate
          server/terminal/runtime-remote.test.ts
          server/services/__tests__/device-transfer-tasks.test.ts
          server/lib/__tests__/executor-binaries.test.ts
          server/lib/__tests__/executor-bootstrap-ticket.test.ts
          server/lib/__tests__/executor-install-script.test.ts
          server/routes/__tests__/executor-bootstrap.test.ts
          scripts/lib/__tests__/executor-manifest.test.ts
          tests/update-server-tools-route.test.ts
          tests/executor-bootstrap-e2e.test.ts
          frontend/lib/device-config.test.ts
