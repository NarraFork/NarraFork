name: Release
run-name: Release ${{ inputs.tag }} (${{ inputs.publish && 'publish' || 'verify' }})

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag reachable from the default branch (vX.Y.Z)
        required: true
        type: string
      publish:
        description: Publish after verification and release Environment approval
        required: true
        type: boolean
        default: false
      index_only:
        description: Repair the index of an already-public release without building or publishing assets
        required: true
        type: boolean
        default: false
      source_run_id:
        description: Optional original build run ID to resume without rebuilding
        required: false
        type: string
        default: ""
      build_run_id:
        description: Original build run to re-verify without source tests or product compilation
        required: false
        type: string
        default: ""
      build_run_attempt:
        description: Explicit attempt of the original build run (required with build_run_id)
        required: false
        type: string
        default: ""
      smoke_target:
        description: Optional single target for diagnostic-only re-verification (cannot publish or assemble)
        required: false
        type: string
        default: ""

permissions:
  contents: read

# Serialize versions as well as retries: an older stable must never race a newer latest.
concurrency:
  group: main-program-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  BUN_CONFIG_REGISTRY: https://registry.npmjs.org

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      version: ${{ steps.plan.outputs.version }}
      repository: ${{ steps.plan.outputs.repository }}
      default-branch: ${{ steps.plan.outputs.default-branch }}
      index-only: ${{ steps.plan.outputs.index-only }}
      matrix: ${{ steps.plan.outputs.matrix }}
      restore-mode: ${{ steps.plan.outputs.restore-mode }}
      source-run-id: ${{ steps.plan.outputs.source-run-id }}
      build-reuse-mode: ${{ steps.plan.outputs.build-reuse-mode }}
      smoke-only: ${{ steps.plan.outputs.smoke-only }}
      peer-action: ${{ steps.plan.outputs.peer-action }}
      peer-matrix: ${{ steps.plan.outputs.peer-matrix }}
      remote-frontend: ${{ steps.plan.outputs.remote-frontend }}
    steps:
      - name: Require the trusted dispatch entry
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$EVENT_NAME" = workflow_dispatch
          test -n "$DEFAULT_BRANCH"
          test "$WORKFLOW_REF" = "refs/heads/$DEFAULT_BRANCH"
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Install control dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Resolve immutable release plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          INDEX_ONLY: ${{ inputs.index_only }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_RUN_ATTEMPT: ${{ inputs.build_run_attempt }}
          SMOKE_TARGET: ${{ inputs.smoke_target }}
        run: >-
          bun scripts/ci-release.ts preflight --tag="$RELEASE_TAG"
          --publish="$PUBLISH_REQUESTED" --source-run-id="$SOURCE_RUN_ID" --index-only="$INDEX_ONLY"
          --build-run-id="$BUILD_RUN_ID" --build-run-attempt="$BUILD_RUN_ATTEMPT" --smoke-target="$SMOKE_TARGET"
          --plan=.ci-release/control/plan.json
      - name: Bundle trusted control code for jobs without dependency installation
        run: bun build scripts/ci-release.ts --target=bun --outfile=.ci-release/control/control.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-release/control/
          if-no-files-found: error
          retention-days: 30

  peer-build:
    name: Peer Build (${{ matrix.platform }})
    needs: [preflight]
    if: ${{ needs.preflight.outputs.peer-action == 'build' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.peer-matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.commit }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.1
          check-latest: false
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-release/control/
          digest-mismatch: error
      - name: Build only the frozen peer source and pinned recipe
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bun .ci-release/control/control.js peer-build --plan=.ci-release/control/plan.json --platform="$PLATFORM" --output=.ci-release/peer-binaries
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-peer-build-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-release/peer-binaries/
          if-no-files-found: error
          retention-days: 30

  peer-smoke:
    name: Peer Native Smoke (${{ matrix.platform }})
    needs: [preflight, peer-build]
    if: ${{ needs.preflight.outputs.peer-action == 'build' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.peer-matrix) }}
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-release/control/
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-peer-build-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-release/peer-binaries/
          digest-mismatch: error
      - name: Native version, protocol, side-effect-free queries and local shutdown
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bun .ci-release/control/control.js peer-smoke --plan=.ci-release/control/plan.json --platform="$PLATFORM" --output=.ci-release/peer-binaries
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-peer-native-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-release/peer-binaries/
          if-no-files-found: error
          retention-days: 30

  peer-assemble:
    name: Peer Assemble
    needs: [preflight, peer-smoke]
    if: ${{ needs.preflight.outputs.peer-action == 'build' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.commit }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-release/control/
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-peer-native-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-release/peer-native/
          digest-mismatch: error
      - name: Bind all six native proofs and the real production licenses
        run: bun .ci-release/control/control.js peer-assemble --plan=.ci-release/control/plan.json --native-dir=.ci-release/peer-native --output=.ci-release/peer-bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-peer-bundle-${{ needs.preflight.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-release/peer-bundle/
          if-no-files-found: error
          retention-days: 30

  peer-restore:
    name: Restore original peer bundle
    needs: [preflight]
    if: ${{ needs.preflight.outputs.peer-action == 'restore' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-release/control/
          digest-mismatch: error
      - name: Recover original peer plan and bundle without rebuilding or reselecting pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun .ci-release/control/control.js peer-restore --plan=.ci-release/control/plan.json --output=.ci-release/restored-peer

  verify:
    name: Verify release source
    needs: [preflight]
    if: ${{ needs.preflight.outputs.restore-mode == 'false' && needs.preflight.outputs.build-reuse-mode == 'false' }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      checkout-ref: ${{ needs.preflight.outputs.commit }}
      release-version: ${{ needs.preflight.outputs.version }}

  build:
    name: Build (${{ matrix.target }})
    needs: [preflight, verify]
    if: ${{ needs.preflight.outputs.restore-mode == 'false' && needs.preflight.outputs.build-reuse-mode == 'false' }}
    runs-on: ${{ matrix.buildRunner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.commit }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, native Node 24
        with:
          name: ci-frontend
          path: dist/frontend/
      - name: Strict target build
        env:
          TARGET: ${{ matrix.target }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.commit }}
          NF_BUILD_GITHUB_REPOSITORY: ${{ needs.preflight.outputs.repository }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          bun scripts/build-cross-platform.ts --platform="$TARGET" --skip-frontend --release-ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-platform-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/${{ matrix.binary }}
            dist/${{ matrix.binary }}.metadata.json
          if-no-files-found: error
          retention-days: 30

  restore-platform:
    name: Restore original platform (${{ matrix.target }})
    needs: [preflight]
    if: ${{ needs.preflight.outputs.build-reuse-mode == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-release/control/
          digest-mismatch: error
      - name: Restore exact original platform bytes
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: >-
          bun .ci-release/control/control.js restore-platform --plan=.ci-release/control/plan.json
          --target="$TARGET" --platform-dir=.ci-release/platform
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-platform-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-release/platform/${{ matrix.binary }}
            .ci-release/platform/${{ matrix.binary }}.metadata.json
          if-no-files-found: error
          retention-days: 30

  smoke:
    name: Smoke (${{ matrix.target }})
    needs: [preflight, build, restore-platform]
    if: >-
      ${{ always() && !cancelled() && needs.preflight.result == 'success' &&
      needs.preflight.outputs.restore-mode == 'false' &&
      ((needs.preflight.outputs.build-reuse-mode == 'false' && needs.build.result == 'success') ||
      (needs.preflight.outputs.build-reuse-mode == 'true' && needs.restore-platform.result == 'success')) }}
    runs-on: ${{ matrix.smokeRunner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, native Node 24
        with:
          name: release-platform-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-release/platform/
          digest-mismatch: error
      - name: Verify complete downloaded platform inputs
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          test -s ".ci-release/platform/$BINARY"
          test -s ".ci-release/platform/$BINARY.metadata.json"
      - name: Run the downloaded binary on its native platform
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.commit }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_REPOSITORY: ${{ needs.preflight.outputs.repository }}
        run: >-
          bun scripts/smoke-release-binary.ts --target="$TARGET"
          --binary=".ci-release/platform/$BINARY" --metadata=".ci-release/platform/$BINARY.metadata.json"
          --commit="$SOURCE_COMMIT" --version="$RELEASE_VERSION" --repository="$RELEASE_REPOSITORY" --output=.ci-release/smoke/smoke.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: release-smoke-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-release/smoke/
          if-no-files-found: error
          retention-days: 30

  restore-remote-frontend:
    name: Restore original remote frontend
    needs: [preflight]
    if: ${{ needs.preflight.outputs.restore-mode == 'false' && needs.preflight.outputs.build-reuse-mode == 'true' && needs.preflight.outputs.remote-frontend == 'true' && needs.preflight.outputs.smoke-only == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-release/control/
      - name: Restore frozen remote artifact without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun .ci-release/control/control.js restore-remote-frontend --plan=.ci-release/control/plan.json --output=.ci-release/remote-frontend
      - name: Upload restored remote frontend
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: remote-frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-release/remote-frontend/
          if-no-files-found: error
          retention-days: 30

  assemble:
    name: Assemble release bundle
    needs: [preflight, verify, build, restore-platform, restore-remote-frontend, smoke]
    if: >-
      ${{ always() && !cancelled() && needs.preflight.result == 'success' &&
      needs.preflight.outputs.restore-mode == 'false' && needs.preflight.outputs.smoke-only == 'false' &&
      needs.smoke.result == 'success' &&
      (needs.preflight.outputs.remote-frontend != 'true' || needs.preflight.outputs.build-reuse-mode != 'true' || needs.restore-remote-frontend.result == 'success') &&
      ((needs.preflight.outputs.build-reuse-mode == 'false' && needs.verify.result == 'success' && needs.build.result == 'success') ||
      (needs.preflight.outputs.build-reuse-mode == 'true' && needs.restore-platform.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, native Node 24
        with:
          name: release-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-release/control/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, native Node 24
        with:
          pattern: release-platform-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-release/platforms/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, native Node 24
        with:
          pattern: release-smoke-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-release/smoke-results/
      - name: Download exact remote frontend artifact
        if: ${{ needs.preflight.outputs.remote-frontend == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: remote-frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-release/remote-frontend/
      - name: Prepare patch tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes zstd
          zstd --version
      - name: Assemble and verify immutable bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bun .ci-release/control/control.js assemble --plan=.ci-release/control/plan.json
          --platforms-dir=.ci-release/platforms --smoke-dir=.ci-release/smoke-results
          --bundle-dir=.ci-release/bundle --remote-frontend-dir=.ci-release/remote-frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: bundle
        with:
          name: release-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-release/bundle/
          if-no-files-found: error
          retention-days: 30
      - name: Record immutable artifact identity
        env:
          ARTIFACT_ID: ${{ steps.bundle.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.bundle.outputs.artifact-digest }}
        run: |
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_DIGEST"
          printf 'Bundle artifact: %s; digest: %s\n' "$ARTIFACT_ID" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bounded index preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-index-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-release/index-preview/
          if-no-files-found: error
          retention-days: 30

  restore:
    name: Verify original release bundle
    needs: [preflight]
    if: ${{ needs.preflight.outputs.restore-mode == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, native Node 24
        with:
          name: release-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-release/control/
      - name: Verify original bundle or prepare read-only index repair
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.preflight.outputs.source-run-id }}
          RELEASE_TAG: ${{ inputs.tag }}
          INDEX_ONLY: ${{ inputs.index_only }}
        run: |
          if [[ "$INDEX_ONLY" == true ]]; then
            bun .ci-release/control/control.js index --plan=.ci-release/control/plan.json --source-run-id="$SOURCE_RUN_ID" --bundle-dir=.ci-release/restored --publish=false
          else
            bun .ci-release/control/control.js restore --source-run-id="$SOURCE_RUN_ID" --tag="$RELEASE_TAG" --bundle-dir=.ci-release/restored
          fi
      - name: Upload repair preview
        if: ${{ inputs.index_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-index-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-release/index-preview/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified release
    needs: [preflight, verify, build, restore-platform, restore-remote-frontend, smoke, assemble, restore, peer-build, peer-smoke, peer-assemble, peer-restore]
    if: >-
      ${{ always() && !cancelled() && inputs.publish && needs.preflight.result == 'success' &&
      needs.preflight.outputs.smoke-only == 'false' &&
      (needs.preflight.outputs.restore-mode == 'true' || needs.preflight.outputs.remote-frontend != 'true' || needs.preflight.outputs.build-reuse-mode != 'true' || needs.restore-remote-frontend.result == 'success') &&
      ((needs.preflight.outputs.peer-action != 'build' && needs.preflight.outputs.peer-action != 'restore') ||
      (needs.preflight.outputs.peer-action == 'build' && needs.peer-build.result == 'success' && needs.peer-smoke.result == 'success' && needs.peer-assemble.result == 'success') ||
      (needs.preflight.outputs.peer-action == 'restore' && needs.peer-restore.result == 'success')) &&
      ((needs.preflight.outputs.restore-mode == 'true' && needs.restore.result == 'success') ||
      (needs.preflight.outputs.restore-mode == 'false' && needs.smoke.result == 'success' && needs.assemble.result == 'success' &&
      ((needs.preflight.outputs.build-reuse-mode == 'false' && needs.verify.result == 'success' && needs.build.result == 'success') ||
      (needs.preflight.outputs.build-reuse-mode == 'true' && needs.restore-platform.result == 'success')))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    outputs:
      index-commit: ${{ steps.publish.outputs.index-commit }}
      index-generation: ${{ steps.publish.outputs.index-generation }}
    permissions:
      contents: write
      actions: read
    steps:
      - name: Freeze one publication deadline with cleanup reserve
        run: printf 'NF_RELEASE_DEADLINE_MS=%s\n' "$(( $(date +%s) * 1000 + 25 * 60 * 1000 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, native Node 24
        with:
          name: release-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-release/control/
      - name: Publish verified release and index, or repair only the index
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          SOURCE_RUN_ID: ${{ needs.preflight.outputs.source-run-id }}
          RELEASE_TAG: ${{ inputs.tag }}
          INDEX_ONLY: ${{ inputs.index_only }}
        run: |
          if [[ "$INDEX_ONLY" == true ]]; then
            bun .ci-release/control/control.js index --plan=.ci-release/control/plan.json --source-run-id="$SOURCE_RUN_ID" --bundle-dir=.ci-release/publish-bundle --publish=true
          else
            bun .ci-release/control/control.js publish --source-run-id="$SOURCE_RUN_ID" --tag="$RELEASE_TAG" --bundle-dir=.ci-release/publish-bundle
          fi
      - name: Retain independent peer publication evidence even if NF later fails
        if: ${{ always() && hashFiles('artifacts/publication/remote-peer-publication-receipt.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: remote-peer-publication-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/publication/remote-peer-publication-receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Record verified GitHub publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: main-publication-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/publication/publication-receipt.json
          if-no-files-found: error
          retention-days: 30

  gate:
    name: Release Gate
    if: ${{ always() }}
    needs: [preflight, verify, build, restore-platform, restore-remote-frontend, smoke, assemble, restore, publish, peer-build, peer-smoke, peer-assemble, peer-restore]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject failed preflight before consuming artifacts
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
        run: test "$PREFLIGHT_RESULT" = success
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, native Node 24
        with:
          name: release-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-release/control/
      - name: Require every mode-specific release dependency
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          RESTORE_MODE: ${{ needs.preflight.outputs.restore-mode }}
          BUILD_REUSE_MODE: ${{ needs.preflight.outputs.build-reuse-mode }}
          SMOKE_ONLY: ${{ needs.preflight.outputs.smoke-only }}
          RESTORE_PLATFORMS_RESULT: ${{ needs.restore-platform.result }}
          REMOTE_FRONTEND_DECLARED: ${{ needs.preflight.outputs.remote-frontend }}
          REMOTE_FRONTEND_RESTORE_RESULT: ${{ needs.restore-remote-frontend.result }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          ASSEMBLE_RESULT: ${{ needs.assemble.result }}
          RESTORE_RESULT: ${{ needs.restore.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          INDEX_ONLY: ${{ inputs.index_only }}
          PEER_ACTION: ${{ needs.preflight.outputs.peer-action }}
          PEER_BUILD_RESULT: ${{ needs.peer-build.result }}
          PEER_SMOKE_RESULT: ${{ needs.peer-smoke.result }}
          PEER_ASSEMBLE_RESULT: ${{ needs.peer-assemble.result }}
          PEER_RESTORE_RESULT: ${{ needs.peer-restore.result }}
          INDEX_COMMIT: ${{ needs.publish.outputs.index-commit }}
          INDEX_GENERATION: ${{ needs.publish.outputs.index-generation }}
        run: bun .ci-release/control/control.js gate
