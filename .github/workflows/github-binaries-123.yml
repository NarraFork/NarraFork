name: Public GitHub binaries to 123

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published release version (without v)
        type: string
        required: true
        default: '0.9.8'

permissions:
  contents: read

concurrency:
  group: github-binaries-123
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  distribute:
    if: ${{ github.repository == 'NarraFork/NarraFork' && github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: release
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        target:
          - linux-x64
          - linux-x64-baseline
          - linux-arm64
          - windows-x64
          - windows-x64-baseline
          - windows-arm64
          - darwin-x64
          - darwin-arm64
    steps:
      - name: Require trusted default-branch entry and strict version
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          test "$EVENT" = workflow_dispatch
          test "$REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$REPOSITORY" = NarraFork/NarraFork
          python3 - <<'PY'
          import os, re
          if not re.fullmatch(r'(0|[1-9]\d{0,8})\.(0|[1-9]\d{0,8})\.(0|[1-9]\d{0,8})', os.environ['VERSION']):
              raise SystemExit('Invalid version')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - name: Install CI-only rclone from signed package sources
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rclone
      - name: Prepare private approved 123 configuration
        env:
          NF_RELAY_RCLONE_CONFIG: ${{ secrets.NF_RELAY_RCLONE_CONFIG }}
        run: |
          python3 - <<'PY'
          import configparser, os, pathlib, urllib.parse
          secret = os.environ.pop("NF_RELAY_RCLONE_CONFIG", "")
          if not secret or len(secret.encode()) > 16384:
              raise SystemExit("Missing bounded relay configuration")
          c = configparser.ConfigParser(interpolation=None)
          try:
              c.read_string(secret)
          except configparser.Error:
              raise SystemExit("Invalid relay configuration") from None
          if c.sections() != ["nf_update"] or c.defaults():
              raise SystemExit("Unexpected relay remote")
          entry = c["nf_update"]
          try:
              u = urllib.parse.urlsplit(entry.get("url", ""))
              valid = (not (set(entry) - {"type", "url", "vendor", "user", "pass"})
                  and entry.get("type") == "webdav" and u.scheme == "https"
                  and u.hostname == "webdav.123pan.cn" and not u.username and not u.password
                  and u.port in (None, 443) and not u.query and not u.fragment)
          except ValueError:
              valid = False
          if not valid:
              raise SystemExit("Relay configuration identity mismatch")
          os.umask(0o077)
          root = pathlib.Path(".ci-release")
          root.mkdir(exist_ok=True)
          with open(root / "123-rclone.conf", "x", opener=lambda p, f: os.open(p, f, 0o600)) as target:
              target.write(secret)
          del secret
          PY
      - name: Verify and distribute published full binaries only
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        run: bun scripts/distribute-github-binaries-123.ts
      - name: Retain public-only distribution receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-binaries-123-receipt-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: .ci-release/github-binaries-123-receipt.json
          if-no-files-found: warn
          retention-days: 30
      - name: Remove only this job private credentials
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path(".ci-release/123-rclone.conf").unlink(missing_ok=True)
          PY

  aggregate:
    needs: distribute
    if: ${{ needs.distribute.result == 'success' && github.repository == 'NarraFork/NarraFork' && github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: github-binaries-123-receipt-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: .ci-release/receipts
          merge-multiple: false
      - name: Require eight complete matching target receipts
        env:
          VERSION: ${{ inputs.version }}
          AGGREGATE_RECEIPTS_DIR: .ci-release/receipts
        run: bun scripts/distribute-github-binaries-123.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-binaries-123-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-release/github-binaries-123-receipt.json
          if-no-files-found: error
          retention-days: 30
