name: go-backend

on:
  push:
    branches:
      - main
    paths:
      - "go_backend/**"
      - "update-server-go/**"
      - "scripts/build-go-backend.ts"
      - "scripts/go-backend-shared.ts"
      - "scripts/go-task.ts"
      - "scripts/release-go-beta.ts"
      - "scripts/go-rollback-drill.ts"
      - "package.json"
      - ".github/workflows/go-backend.yml"
  pull_request:
    paths:
      - "go_backend/**"
      - "update-server-go/**"
      - "scripts/build-go-backend.ts"
      - "scripts/go-backend-shared.ts"
      - "scripts/go-task.ts"
      - "scripts/release-go-beta.ts"
      - "scripts/go-rollback-drill.ts"
      - "package.json"
      - ".github/workflows/go-backend.yml"

jobs:
  go-test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go_backend/go.mod
          cache: true
          cache-dependency-path: go_backend/go.sum
          check-latest: true

      - name: Show Go version
        working-directory: go_backend
        run: go version

      - name: Run Go backend tests
        run: bun scripts/go-task.ts test

      - name: Run Go update server tests
        working-directory: update-server-go
        run: go test ./...

  go-build:
    name: go build artifacts
    runs-on: ubuntu-latest
    needs: go-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go_backend/go.mod
          cache: true
          cache-dependency-path: go_backend/go.sum
          check-latest: true

      - name: Build Go backend artifacts
        run: bun scripts/build-go-backend.ts --platform=all

      - name: Build smoke check
        run: bun scripts/go-task.ts build-smoke

      - name: Upload Go beta artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-backend-beta-artifacts
          path: dist/go-backend/**
          if-no-files-found: error
