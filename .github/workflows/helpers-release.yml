name: Auxiliary helpers and executor release

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Independent immutable auxiliary release kind
        required: true
        type: choice
        options: [helpers, executor]
        default: helpers
      tag:
        description: Existing helpers-v1.0.0 or executor-vX.Y.Z tag on default-branch ancestry
        required: true
        type: string
      publish:
        description: Publish only after native smoke and release Environment approval
        required: true
        type: boolean
        default: false
      source_run_id:
        description: Restore the exact original successful bundle; never rebuild
        required: false
        type: string
        default: ""
      mirror_only:
        description: Retry only the legacy mirror using the original sealed bridge (requires publish)
        required: true
        type: boolean
        default: false
      bridge_run_id:
        description: Original publisher run containing the bridge artifact, not necessarily the build run
        required: false
        type: string
        default: ""
      bridge_run_attempt:
        description: Original bridge attempt if the publisher run has been rerun
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: auxiliary-helper-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Helper preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      kind: ${{ steps.plan.outputs.kind }}
      source-run-id: ${{ steps.plan.outputs.source-run-id }}
    steps:
      - name: Require trusted default-branch dispatch
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$EVENT_NAME" = workflow_dispatch
          test -n "$DEFAULT_BRANCH"
          test "$WORKFLOW_REF" = "refs/heads/$DEFAULT_BRANCH"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install trusted control dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Freeze exact existing tag and source
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_KIND: ${{ inputs.kind }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          MIRROR_ONLY: ${{ inputs.mirror_only }}
          BRIDGE_RUN_ID: ${{ inputs.bridge_run_id }}
          BRIDGE_RUN_ATTEMPT: ${{ inputs.bridge_run_attempt }}
        run: >-
          bun scripts/release-helpers.ts preflight
          --kind="$RELEASE_KIND" --tag="$RELEASE_TAG" --source-run-id="$SOURCE_RUN_ID"
          --publish="$PUBLISH_REQUESTED" --mirror-only="$MIRROR_ONLY"
          --bridge-run-id="$BRIDGE_RUN_ID" --bridge-run-attempt="$BRIDGE_RUN_ATTEMPT"
      - name: Bundle trusted control code
        run: bun build scripts/release-helpers.ts --target=bun --outfile=.helper-release/control/control.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: helper-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: .helper-release/control/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  build:
    name: Build (${{ matrix.platform }})
    needs: preflight
    if: ${{ needs.preflight.outputs.source-run-id == '' }}
    runs-on: ${{ matrix.buildRunner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, buildRunner: ubuntu-24.04 }
          - { platform: linux-arm64, buildRunner: ubuntu-24.04-arm }
          - { platform: darwin-x64, buildRunner: macos-26-intel }
          - { platform: darwin-arm64, buildRunner: macos-26 }
          - { platform: windows-x64, buildRunner: ubuntu-24.04 }
          - { platform: windows-arm64, buildRunner: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.commit }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - if: ${{ needs.preflight.outputs.kind == 'executor' }}
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.24.13
          check-latest: false
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: helper-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: .helper-release/control/
      - name: Build pinned sources in isolated cache
        env:
          PLATFORM: ${{ matrix.platform }}
          CONTAINER_RUNTIME: docker
          DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
        run: >-
          bun .helper-release/control/control.js build
          --platform="$PLATFORM" --output=.helper-release/binaries
          --cache=.helper-release/cache
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: helper-build-${{ matrix.platform }}
          path: .helper-release/binaries/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  smoke:
    name: Native smoke (${{ matrix.platform }})
    needs: [preflight, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-24.04 }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
          - { platform: darwin-x64, runner: macos-26-intel }
          - { platform: darwin-arm64, runner: macos-26 }
          - { platform: windows-x64, runner: windows-2025 }
          - { platform: windows-arm64, runner: windows-11-arm }
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: helper-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: .helper-release/control/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: helper-build-${{ matrix.platform }}
          path: .helper-release/binaries/
      - name: Execute real binaries on their native platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bun .helper-release/control/control.js smoke --platform="$PLATFORM" --output=.helper-release/binaries
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: helper-native-${{ matrix.platform }}
          path: .helper-release/binaries/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  assemble:
    name: Assemble exact helper bundle
    needs: [preflight, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.commit }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: helper-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: .helper-release/control/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: helper-native-*
          path: .helper-release/native/
      - name: Bind smoke receipts, binaries and real license texts
        run: bun .helper-release/control/control.js assemble --output=.helper-release/bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: helper-bundle-${{ needs.preflight.outputs.kind }}-${{ needs.preflight.outputs.commit }}
          path: .helper-release/bundle/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  restore:
    name: Verify original immutable helper bundle
    needs: preflight
    if: ${{ needs.preflight.outputs.source-run-id != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: helper-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: .helper-release/control/
      - name: Check original successful native jobs and exact archive digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun .helper-release/control/control.js restore --output=.helper-release/bundle
      - name: Offline preview only
        run: bun .helper-release/control/control.js preview --output=.helper-release/bundle

  publisher:
    name: Publish approved helper draft
    needs: [preflight, assemble, restore]
    if: >-
      ${{ always() && !cancelled() && inputs.publish && needs.preflight.result == 'success' &&
      ((needs.assemble.result == 'success' && needs.restore.result == 'skipped') ||
      (needs.restore.result == 'success' && needs.assemble.result == 'skipped')) }}
    environment: release
    concurrency:
      group: update-server-publish
      cancel-in-progress: false
    env:
      NF_UPDATE_SERVER: ${{ vars.NF_UPDATE_SERVER }}
      NF_UPDATE_TOKEN: ${{ secrets.NF_UPDATE_TOKEN }}
    outputs:
      mirror-required: ${{ steps.prepare-bridge.outputs.mirror-required || steps.mirror.outputs.mirror-required }}
      mirror-status: ${{ steps.publish.outputs.mirror-status || steps.mirror.outputs.mirror-status }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - name: Freeze one publication deadline with cleanup reserve
        run: printf 'NF_RELEASE_DEADLINE_MS=%s\n' "$(( $(date +%s) * 1000 + 25 * 60 * 1000 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: helper-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: .helper-release/control/
      - name: Recheck exact immutable bundle after Environment approval
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGIN_RUN_ID: ${{ inputs.source_run_id || github.run_id }}
        run: >-
          bun .helper-release/control/control.js restore
          --source-run-id="$ORIGIN_RUN_ID" --output=.helper-release/bundle
      - name: Prepare immutable update server bridge
        id: prepare-bridge
        if: ${{ !inputs.mirror_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.source-run-attempt }}
        run: >-
          bun .helper-release/control/control.js prepare-bridge --output=.helper-release/bundle
          --bridge-dir=.helper-release/bridge --source-run-attempt="$SOURCE_RUN_ATTEMPT"
      - name: Seal immutable update server bridge artifact
        id: bridge-artifact
        if: ${{ steps.prepare-bridge.outputs.mirror-required == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: update-server-bridge-${{ inputs.kind }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .helper-release/bridge/
          if-no-files-found: error
          retention-days: 30
      - name: Draft, upload missing assets without clobber, verify, publish
        id: publish
        if: ${{ !inputs.mirror_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.source-run-attempt }}
          BRIDGE_ARTIFACT_ID: ${{ steps.bridge-artifact.outputs.artifact-id }}
          BRIDGE_ARTIFACT_DIGEST: ${{ steps.bridge-artifact.outputs.artifact-digest }}
        run: >-
          bun .helper-release/control/control.js publish --output=.helper-release/bundle
          --bridge-dir=.helper-release/publish-bridge --source-run-attempt="$SOURCE_RUN_ATTEMPT"
          --bridge-artifact-id="$BRIDGE_ARTIFACT_ID" --bridge-artifact-digest="$BRIDGE_ARTIFACT_DIGEST"
      - name: Mirror accepted bytes and verify legacy publication
        id: mirror
        if: ${{ inputs.mirror_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.source-run-attempt }}
        run: >-
          bun .helper-release/control/control.js mirror --output=.helper-release/bundle
          --bridge-dir=.helper-release/mirror-bridge --source-run-attempt="$SOURCE_RUN_ATTEMPT"
      - name: Preserve partial publication receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: update-server-helper-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .helper-release/publish-bridge/tools-mirror-receipt.json
            .helper-release/mirror-bridge/tools-mirror-receipt.json
          if-no-files-found: ignore
          retention-days: 30

  gate:
    name: Auxiliary Release Gate
    if: ${{ always() }}
    needs: [preflight, build, smoke, assemble, restore, publisher]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject failed preflight
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
        run: test "$PREFLIGHT_RESULT" = success
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: helper-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: .helper-release/control/
      - name: Require build, publication and configured mirror receipts
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          BUILD_RESULT: ${{ needs.build.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          ASSEMBLE_RESULT: ${{ needs.assemble.result }}
          RESTORE_RESULT: ${{ needs.restore.result }}
          PUBLISH_RESULT: ${{ needs.publisher.result }}
          MIRROR_ONLY: ${{ inputs.mirror_only }}
          MIRROR_REQUIRED: ${{ needs.publisher.outputs.mirror-required }}
          MIRROR_STATUS: ${{ needs.publisher.outputs.mirror-status }}
        run: bun .helper-release/control/control.js gate
