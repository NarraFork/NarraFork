# 仅供操作者审阅的 coturn STUN-only 配置样例；原型不会加载或启动它。
# 默认只监听本机 UDP 3478，不提供公网打洞服务，不支持 TURN allocation。
# 用于真实跨 NAT 验证前，操作者须配置实际公网监听地址及网络/主机防火墙。
# 生产开放前必须设计并验证来源/IP 限流、总带宽预算、反射放大防护、监控与日志脱敏；
# 这些防滥用措施不由本样例自动提供，不得直接将监听地址改为 0.0.0.0 后公网部署。
# 配置项已核对 coturn 4.6.3 官方示例；部署者仍须核对所用版本，不隐式安装依赖。
listening-ip=127.0.0.1
listening-port=3478
stun-only
no-cli
no-tcp
no-tls
no-dtls
# 减少多地址 NAT 行为探测与旧 STUN 响应带来的放大面；不替代上述网络限流。
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780
