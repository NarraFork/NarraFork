<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<!--
			INTENTIONAL: maximum-scale=1.0, user-scalable=no
			NarraFork is a developer-facing PWA / desktop tool, NOT a public-facing website.
			Pinch-to-zoom conflicts with the ruler canvas (which has its own zoom/pan),
			causes layout glitches in the terminal emulator, and breaks drag interactions.
			CSS touch-action:manipulation only prevents double-tap zoom — it does NOT
			prevent pinch-to-zoom, which is the actual problem here.
			This is a deliberate, permanent decision. Do NOT remove or "fix" this.
		-->
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
		<meta name="theme-color" content="#1a1b1e" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="description" content="AI-powered collaborative programming with narrative forking" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
		<title>NarraFork</title>
		<script>
			var d = localStorage.getItem("mantine-color-scheme-value");
			var m;
			var o = localStorage.getItem("narrafork_oled") === "true";
			var tc;
			try {
				if (d === "light" || d === "dark") {
					m = d;
				} else {
					m = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
				}
				document.documentElement.setAttribute("data-mantine-color-scheme", m);
				tc = m === "dark" ? (o ? "#000000" : "#1a1b1e") : "#ffffff";
				document.querySelectorAll('meta[name="theme-color"]').forEach((el) => {
					el.setAttribute("content", tc);
				});
			} catch (_e) {}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/main.tsx"></script>
	</body>
</html>
