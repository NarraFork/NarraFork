<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#1a1b1e" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="description" content="AI-powered collaborative programming with narrative forking" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
		<title>NarraFork</title>
		<script>var d=localStorage.getItem("mantine-color-scheme-value"),m,o=localStorage.getItem("narrafork_oled")==="true";try{if(d==="light"||d==="dark")m=d;else m=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-mantine-color-scheme",m);var tc=m==="dark"?(o?"#000000":"#1a1b1e"):"#ffffff";document.querySelectorAll('meta[name="theme-color"]').forEach(function(el){el.setAttribute("content",tc)})}catch(_e){}</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/main.tsx"></script>
	</body>
</html>
