const KIND_ZH = { note: "笔记", task: "任务", assertion: "断言", view: "视图" };
const STATUS_ZH = { todo: "待办", doing: "进行中", blocked: "受阻", submitted: "待验收", done: "完成", cancelled: "取消" };
const STANCE_ZH = { hypothesis: "假设", accepted: "采纳", refuted: "否定" };
const ROLE_ZH = { link: "链接", embed: "嵌入", depends: "前置", basis: "依据", source: "出处" };
const commits = (DATA && DATA.commits) || [];
const $ = (id) => document.getElementById(id);

function emptyState() {
	return { spaces: {}, actors: {}, blocks: {}, links: {}, locks: {}, pending: {}, traces: {} };
}

function apply(st, op, seq, actor) {
	const b = op.addr ? st.blocks[op.addr] : null;
	switch (op.op) {
		case "space.create": st.spaces[op.space] = { kind: op.kind, title: op.title }; break;
		case "actor.register": st.actors[op.actor] = { kind: op.kind, creator: op.creator }; break;
		case "block.create":
			st.blocks[op.addr] = { addr: op.addr, space: op.space, parent: op.parent || null, order: op.order, kind: op.kind, content: op.content || "", props: { ...(op.props || {}) }, version: seq, created: seq, deleted: false };
			break;
		case "block.update":
			if (!b) break;
			if ("content" in op) b.content = op.content;
			for (const [k, v] of Object.entries(op.props || {})) { if (v === null) delete b.props[k]; else b.props[k] = v; }
			if (op.kind) b.kind = op.kind;
			b.version = seq;
			break;
		case "block.move": if (b) { b.parent = op.parent || null; b.order = op.order; b.version = seq; } break;
		case "block.delete": if (b) { b.deleted = true; b.version = seq; } break;
		case "block.restore": if (b) { b.deleted = false; b.version = seq; } break;
		case "link.add": st.links[op.id] = { from: op.from, role: op.kind || op.role, target: op.target, data: op.data || {} }; break;
		case "link.remove": if (st.links[op.id]) st.links[op.id].removed = true; break;
		case "lock.set": st.locks[op.root] = { locker: op.locker, seq }; break;
		case "lock.clear": delete st.locks[op.root]; break;
		case "pending.create": st.pending[op.id] = { status: "pending", ops: op.ops, reason: op.reason }; break;
		case "pending.decide": if (st.pending[op.id]) st.pending[op.id].status = op.status; break;
		case "trace.add": st.traces[op.task] = { agent: op.agent, calls: op.calls.length }; break;
	}
}

const cache = new Map();
function stateAt(seq) {
	if (cache.has(seq)) return cache.get(seq);
	const st = emptyState();
	for (const c of commits) {
		if (c.seq > seq) break;
		for (const op of c.ops) apply(st, op, c.seq, c.actor);
	}
	cache.set(seq, st);
	return st;
}

function cached(st, key, fn) {
	if (!st.memo) st.memo = new Map();
	if (!st.memo.has(key)) st.memo.set(key, fn());
	return st.memo.get(key);
}

function childrenOf(st, key, showDeleted) {
	const idx = cached(st, "kids", () => {
		const m = new Map();
		for (const b of Object.values(st.blocks)) {
			const k = b.parent || b.space + "/";
			if (!m.has(k)) m.set(k, []);
			m.get(k).push(b);
		}
		for (const list of m.values()) list.sort((a, b) => a.order - b.order);
		return m;
	});
	return (idx.get(key) || []).filter((b) => showDeleted || !b.deleted);
}

// 事实与过程（设计文档 §2.1）：任务和它下面的块是过程，其余是事实；不另存，由位置推出来
function taskOf(st, addr) {
	return cached(st, "t:" + addr, () => {
		for (let a = addr; a && st.blocks[a]; a = st.blocks[a].parent) if (st.blocks[a].kind === "task") return a;
		return null;
	});
}
function isProcess(st, addr) {
	const b = st.blocks[addr];
	return (st.spaces[b.space] || {}).kind === "session" || taskOf(st, addr) !== null;
}
function subtreeOf(st, addr) {
	const out = [addr];
	for (const k of childrenOf(st, addr, false)) out.push(...subtreeOf(st, k.addr));
	return out;
}
function unsettled(st, t) {
	const b = st.blocks[t];
	if (b.kind !== "task" || b.deleted || !["done", "cancelled"].includes(b.props.status)) return false;
	const since = b.props.settled || 0;
	return subtreeOf(st, t).slice(1).some((a) => st.blocks[a].kind !== "task" && taskOf(st, a) === t && st.blocks[a].version > since);
}
function live(st, t) {
	return cached(st, "live:" + t, () => ["todo", "doing", undefined].includes(st.blocks[t].props.status) || unsettled(st, t));
}
function spansOf(st, addr) {
	return cached(st, "sp:" + addr, () => Object.values(st.links)
		.filter((l) => !l.removed && l.from === addr && l.role === "basis" && String(l.target).startsWith("code:"))
		.map((l) => {
			const [lo, hi] = String((l.data || {}).lines || "").split("-").map(Number);
			return { target: l.target, path: l.target.slice(5).split(/#|:(?=\d)/)[0], lo: lo || 0, hi: hi || lo || 0 };
		}));
}
function liveSpans(st) {
	return cached(st, "liveSpans", () => {
		const out = [];
		for (const b of Object.values(st.blocks)) {
			if (b.deleted || b.kind === "task") continue;
			const t = taskOf(st, b.addr);
			if (t && live(st, t)) for (const sp of spansOf(st, b.addr)) out.push([sp, t]);
		}
		return out;
	});
}
function liveAround(st, addr) {
	// 挂在它下面的任务、笔记碰到同一段代码的任务、它等确认的改动；只链接到它的不算
	const out = childrenOf(st, addr, false).filter((k) => k.kind === "task" && live(st, k.addr)).map((k) => k.addr);
	const mine = spansOf(st, addr);
	if (mine.length) for (const [sp, t] of liveSpans(st)) {
		if (out.includes(t)) continue;
		if (mine.some((m) => m.target === sp.target || (m.path === sp.path && m.lo && sp.lo && m.lo <= sp.hi && sp.lo <= m.hi))) out.push(t);
	}
	for (const [id, x] of Object.entries(st.pending)) if (x.status === "pending" && x.ops.some((o) => o.addr === addr)) out.push(id);
	return out;
}
function viewKids(st, addr) {
	const kids = childrenOf(st, addr, ui.showDeleted);
	if (!ui.factsOnly || isProcess(st, addr)) return kids;
	return kids.filter((k) => !isProcess(st, k.addr) && !k.props.invalid);
}
function touchesFacts(c) {
	// 这个提交有没有改到事实：按提交前后两个时刻各判断一次
	return cached(stateAt(c.seq), "touch", () => {
		const after = stateAt(c.seq);
		const before = stateAt(c.seq - 1);
		return c.ops.some((op) => {
			const addrs = [op.addr, op.from, op.parent].filter(Boolean);
			return addrs.some((a) => (after.blocks[a] && !isProcess(after, a)) || (before.blocks[a] && !isProcess(before, a)));
		});
	});
}

function diffOf(base, cur, addr) {
	const now = cur.blocks[addr];
	const was = base.blocks[addr];
	if (!was || (was.deleted && !now.deleted)) return "add";
	if (now.deleted && !was.deleted) return "del";
	if (was.parent !== now.parent) return "mov";
	if (was.content !== now.content || JSON.stringify(was.props) !== JSON.stringify(now.props) || was.kind !== now.kind) return "chg";
	return "";
}

function actorKind(c) {
	if (c.kind === "system" && !String(c.summary).startsWith("确认") && !String(c.summary).startsWith("退回")) return "system";
	return String(c.actor).startsWith("human:") ? "human" : "agent";
}

function chipsFor(st, b) {
	const out = [];
	const p = b.props;
	// 第二版：只标例外。任务的状态画成复选框，指派画成 @
	if (p.alias) out.push(["alias", p.alias]);
	if (b.kind === "task") {
		const s = p.status || "todo";
		out.push(["st-" + s, { todo: "☐", doing: "◐", done: "☑", cancelled: "☒" }[s] + " " + (STATUS_ZH[s] || s)]);
		if (p.assignee) out.push(["", "@" + p.assignee]);
	}
	if (p.question) out.push(["", "问"]);
	if (p.rec) out.push(["", p.adopted ? "建议（已采纳）" : "建议"]);
	if (b.kind === "task" && unsettled(st, b.addr)) out.push(["st-blocked", "待整理"]);
	if (p.report) out.push(["", "报告"]);
	if (p.invalid) out.push(["stance-refuted", "不成立"]);
	if (st.locks[b.addr]) out.push(["approved", "锁定：" + st.locks[b.addr].locker]);
	if (st.traces[b.addr]) out.push(["", "运行记录 " + st.traces[b.addr].calls + " 次调用"]);
	if (p.archived) out.push(["", "归档"]);
	const pending = Object.entries(st.pending).filter(([, x]) => x.status === "pending" && x.ops.some((o) => o.addr === b.addr)).map(([id]) => id);
	if (ui.factsOnly && !isProcess(st, b.addr)) {
		const around = liveAround(st, b.addr).map((x) => (st.blocks[x] && st.blocks[x].props.alias) || x);
		if (around.length) out.push(["live", "进行中：" + around.slice(0, 3).join("、") + (around.length > 3 ? " 等 " + around.length + " 项" : "")]);
	} else if (pending.length) out.push(["st-blocked", "等确认：" + pending.join(",")]);
	return out;
}

function linksFor(st, addr) {
	const by = {};
	for (const l of Object.values(st.links)) {
		if (l.removed || l.from !== addr || l.role === "link" || l.role === "embed") continue;
		const t = st.blocks[l.target] ? (st.blocks[l.target].props.alias || l.target) : l.target;
		(by[ROLE_ZH[l.role] || l.role] ||= []).push(t);
	}
	return Object.entries(by).map(([r, ts]) => r + "：" + ts.join("；")).join("　");
}

const ui = { seq: commits.length ? commits[commits.length - 1].seq : 0, base: null, space: "p", page: "", onlyChanged: false, showDeleted: false, factsOnly: true, collapsed: new Set(), touched: new Set(), playing: null };
const BUDGET = 120; // 默认按这么多块逐层展开：先放满一层，再放下一层（§3.1）

function budgetCollapse(st, roots) {
	// 用户点过的保持原样；其余按预算决定折不折
	const open = new Set(roots.map((r) => r.addr));
	let used = roots.length;
	let level = roots.map((r) => r.addr);
	while (level.length) {
		const next = [];
		for (const a of level) {
			const kids = viewKids(st, a);
			if (!kids.length) continue;
			if (used + kids.length > BUDGET && !roots.some((r) => r.addr === a)) { level = []; next.length = 0; break; }
			open.add(a);
			used += kids.length;
			next.push(...kids.map((k) => k.addr));
		}
		level = next;
	}
	for (const b of Object.values(st.blocks)) {
		if (ui.touched.has(b.addr)) continue;
		if (open.has(b.addr)) ui.collapsed.delete(b.addr);
		else ui.collapsed.add(b.addr);
	}
}

function el(tag, cls, text) {
	const n = document.createElement(tag);
	if (cls) n.className = cls;
	if (text !== undefined) n.textContent = text;
	return n;
}

function subtreeChanged(cur, base, addr, memo) {
	if (memo.has(addr)) return memo.get(addr);
	let changed = !!diffOf(base, cur, addr);
	if (!changed) for (const k of childrenOf(cur, addr, true)) if (subtreeChanged(cur, base, k.addr, memo)) { changed = true; break; }
	memo.set(addr, changed);
	return changed;
}

function renderNode(cur, base, b, memo) {
	const node = el("div", "node");
	const d = diffOf(base, cur, b.addr);
	const row = el("div", "row" + (d ? " " + d : ""));
	row.appendChild(el("span", "mark", { add: "+", chg: "~", del: "−", mov: "↷" }[d] || ""));
	const kids = viewKids(cur, b.addr).filter((k) => !ui.onlyChanged || subtreeChanged(cur, base, k.addr, memo));
	const tg = el("button", "toggle", kids.length ? (ui.collapsed.has(b.addr) ? "▸" : "▾") : "·");
	tg.type = "button";
	tg.disabled = !kids.length;
	tg.setAttribute("aria-label", ui.collapsed.has(b.addr) ? "展开" : "折叠");
	tg.addEventListener("click", () => { ui.touched.add(b.addr); ui.collapsed.has(b.addr) ? ui.collapsed.delete(b.addr) : ui.collapsed.add(b.addr); render(); });
	row.appendChild(tg);
	const body = el("div", "body");
	const l1 = el("div", "line1");
	const multi = b.content.includes("\n");
	const first = multi ? b.content.split("\n")[0] : b.content;
	l1.appendChild(el("span", "text", first || "（空）"));
	const chips = el("span", "chips");
	for (const [c, t] of chipsFor(cur, b)) chips.appendChild(el("span", "chip" + (c ? " " + c : ""), t));
	l1.appendChild(chips);
	l1.appendChild(el("span", "addr", b.addr));
	body.appendChild(l1);
	if (multi) body.appendChild(el("span", "text multi", b.content.split("\n").slice(1).join("\n")));
	const lk = ui.factsOnly ? "" : linksFor(cur, b.addr); // 依据和出处是另一个维度：只看事实时不列
	if (lk) body.appendChild(el("div", "links", "↳ " + lk));
	row.appendChild(body);
	node.appendChild(row);
	if (kids.length && !ui.collapsed.has(b.addr)) {
		const box = el("div", "kids");
		for (const k of kids) box.appendChild(renderNode(cur, base, k, memo));
		node.appendChild(box);
	}
	return node;
}

function describeOp(st, op) {
	const short = (s) => { const f = String(s || "").split("\n")[0]; return f.length > 60 ? f.slice(0, 59) + "…" : f; };
	switch (op.op) {
		case "block.create": return "新增 " + op.addr + "：" + short(op.content);
		case "block.update": {
			const parts = [];
			if ("content" in op) parts.push("内容 → " + short(op.content));
			const pr = Object.entries(op.props || {}).map(([k, v]) => k + "=" + (v === null ? "（删除）" : Array.isArray(v) ? v.join(",") : v));
			if (pr.length) parts.push(pr.join("，"));
			return "修改 " + op.addr + "：" + parts.join("；");
		}
		case "block.move": return "移动 " + op.addr + " → " + (op.parent || "顶层");
		case "block.delete": return "删除 " + op.addr;
		case "link.add": return (ROLE_ZH[op.kind || op.role] || op.kind || op.role) + " " + op.from + " → " + op.target;
		case "link.remove": return "移除链接 " + op.id;
		case "lock.set": return "锁定 " + op.root + (op.delegate ? "（" + op.delegate + " 可以代为确认）" : "");
		case "lock.clear": return "解锁 " + op.root;
		case "pending.create": return "待确认 " + op.id + "：" + op.reason + "（" + op.ops.length + " 个操作）";
		case "pending.decide": return (op.status === "confirmed" ? "确认 " : "退回 ") + op.id + (op.note ? "：" + op.note : "");
		case "trace.add": return "挂上 " + op.agent + " 的运行记录（" + op.calls.length + " 次调用）";
		case "space.create": return "建立空间 " + op.space + "（" + op.title + "）";
		case "actor.register": return "登记参与者 " + op.actor + (op.creator ? "，创建者 " + op.creator : "");
		default: return op.op;
	}
}

function renderDetail(cur) {
	const box = $("detail");
	box.replaceChildren();
	const c = commits.find((x) => x.seq === ui.seq);
	if (!c) { box.appendChild(el("div", "empty", "还没有提交")); return; }
	box.appendChild(el("div", "who", "#" + c.seq + " " + c.summary));
	let meta = (c.ts || "").replace("T", " ").slice(0, 16) + " · " + c.actor;
	if (c.recorded_by) meta += "，由 " + c.recorded_by + " 代记";
	if (c.on_behalf_of) meta += "（责任人 " + c.on_behalf_of + "）";
	box.appendChild(el("div", "meta", meta));
	const ol = el("ol", "ops");
	const shown = c.ops.slice(0, 60);
	for (const op of shown) ol.appendChild(el("li", "", describeOp(cur, op)));
	if (c.ops.length > shown.length) ol.appendChild(el("li", "", "……另有 " + (c.ops.length - shown.length) + " 个操作"));
	box.appendChild(ol);
	if (ui.base !== null) box.appendChild(el("div", "meta", "高亮：从第 " + ui.base + " 个提交到现在的变化"));
}

function renderStats(cur) {
	const blocks = Object.values(cur.blocks).filter((b) => !b.deleted);
	const tasks = blocks.filter((b) => b.kind === "task");
	const done = tasks.filter((b) => b.props.status === "done").length;
	const pending = Object.values(cur.pending).filter((c) => c.status === "pending").length;
	const parts = [
		["提交", ui.seq + " / " + (commits.length ? commits[commits.length - 1].seq : 0)],
		["块", blocks.length],
		["任务", tasks.length + "（完成 " + done + "）"],
		["不成立", blocks.filter((b) => b.props.invalid).length],
		["待确认", pending],
	];
	$("stats").replaceChildren(...parts.map(([k, v]) => { const s = el("span"); s.append(k + " "); s.appendChild(el("b", "", String(v))); return s; }));
}

function renderSelectors(cur) {
	const spaceSel = $("space");
	const spaces = Object.entries(cur.spaces);
	if (!spaces.find(([k]) => k === ui.space) && spaces.length) ui.space = spaces[0][0];
	spaceSel.replaceChildren(...spaces.map(([k, v]) => { const o = el("option", "", k + " · " + v.title); o.value = k; o.selected = k === ui.space; return o; }));
	const pageSel = $("page");
	const roots = childrenOf(cur, ui.space + "/", ui.showDeleted).filter((r) => !ui.factsOnly || !isProcess(cur, r.addr));
	if (ui.page && !roots.find((r) => r.addr === ui.page)) ui.page = "";
	const all = el("option", "", "全部页");
	all.value = "";
	pageSel.replaceChildren(all, ...roots.map((r) => { const o = el("option", "", (r.props.alias ? r.props.alias + " · " : "") + r.content.split("\n")[0].slice(0, 28)); o.value = r.addr; o.selected = r.addr === ui.page; return o; }));
}

function renderTicks() {
	const box = $("ticks");
	if (box.childElementCount !== commits.length) {
		const maxOps = Math.max(1, ...commits.map((c) => c.ops.length));
		box.replaceChildren(...commits.map((c) => {
			const t = el("button", "tick " + actorKind(c));
			t.type = "button";
			t.style.height = Math.round(8 + 36 * Math.log(1 + c.ops.length) / Math.log(1 + maxOps)) + "px";
			t.title = "#" + c.seq + " " + c.actor + "：" + c.summary;
			t.setAttribute("aria-label", "第 " + c.seq + " 个提交：" + c.summary);
			if (c.ops.some((o) => o.op === "plan.approve" || o.op === "cr.create" || o.op === "cr.decide")) t.classList.add("flag");
			t.addEventListener("click", () => go(c.seq));
			return t;
		}));
	}
	[...box.children].forEach((t, i) => {
		const s = commits[i].seq;
		t.classList.toggle("proc", ui.factsOnly && !touchesFacts(commits[i]));
		t.classList.toggle("past", s <= ui.seq);
		t.classList.toggle("cur", s === ui.seq);
		t.classList.toggle("base", s === ui.base);
	});
	const cur = box.children[commits.findIndex((c) => c.seq === ui.seq)];
	if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest", inline: "nearest" });
}

function render() {
	const cur = stateAt(ui.seq);
	const base = stateAt(ui.base !== null ? ui.base : ui.seq - 1);
	renderSelectors(cur);
	renderStats(cur);
	const tree = $("tree");
	tree.replaceChildren();
	const memo = new Map();
	let roots = childrenOf(cur, ui.space + "/", ui.showDeleted);
	if (ui.factsOnly) roots = roots.filter((r) => !isProcess(cur, r.addr));
	if (ui.page) roots = roots.filter((r) => r.addr === ui.page);
	budgetCollapse(cur, roots);
	if (ui.onlyChanged) roots = roots.filter((r) => subtreeChanged(cur, base, r.addr, memo));
	$("treeTitle").textContent = "第 " + ui.seq + " 个提交时的大纲";
	if (!roots.length) tree.appendChild(el("div", "empty", ui.onlyChanged ? "这一步在这个空间里没有变化" : "这个空间在这一刻还是空的"));
	for (const r of roots) { const pg = el("div", "page"); pg.appendChild(renderNode(cur, base, r, memo)); tree.appendChild(pg); }
	renderDetail(cur);
	const c = commits.find((x) => x.seq === ui.seq);
	$("now").replaceChildren();
	$("now").append("第 ");
	$("now").appendChild(el("b", "", String(ui.seq)));
	$("now").append(" 个提交" + (c ? " · " + (c.ts || "").replace("T", " ").slice(0, 16) + " · " + c.actor + "：" + c.summary : ""));
	$("seq").value = String(ui.seq);
	$("pin").hidden = ui.base === ui.seq;
	$("unpin").hidden = ui.base === null;
	renderTicks();
}

function step(dir) {
	// 只看事实时，单步跳过没改到事实的提交
	let i = commits.findIndex((c) => c.seq === ui.seq) + dir;
	while (ui.factsOnly && i > 0 && i < commits.length - 1 && !touchesFacts(commits[i])) i += dir;
	if (i >= 0 && i < commits.length) go(commits[i].seq);
}

function go(seq) {
	if (!commits.length) return;
	const lo = commits[0].seq;
	const hi = commits[commits.length - 1].seq;
	ui.seq = Math.max(lo, Math.min(hi, seq));
	render();
}

function stopPlay() {
	if (ui.playing) clearInterval(ui.playing);
	ui.playing = null;
	$("play").textContent = "播放";
	$("play").setAttribute("aria-pressed", "false");
}

function init() {
	if (!commits.length) {
		$("tree").replaceChildren(el("div", "empty", "没有提交数据。先在 prototypes/outline 下运行 python3 outline.py export"));
		return;
	}
	const seqInput = $("seq");
	seqInput.min = String(commits[0].seq);
	seqInput.max = String(commits[commits.length - 1].seq);
	seqInput.addEventListener("input", () => go(Number(seqInput.value)));
	$("first").addEventListener("click", () => go(commits[0].seq));
	$("prev").addEventListener("click", () => step(-1));
	$("next").addEventListener("click", () => step(1));
	$("last").addEventListener("click", () => go(commits[commits.length - 1].seq));
	$("play").addEventListener("click", () => {
		if (ui.playing) return stopPlay();
		if (ui.seq >= commits[commits.length - 1].seq) go(commits[0].seq);
		$("play").textContent = "暂停";
		$("play").setAttribute("aria-pressed", "true");
		ui.playing = setInterval(() => { if (ui.seq >= commits[commits.length - 1].seq) return stopPlay(); step(1); }, 800);
	});
	$("pin").addEventListener("click", () => { ui.base = ui.seq; render(); });
	$("unpin").addEventListener("click", () => { ui.base = null; render(); });
	$("space").addEventListener("change", (e) => { ui.space = e.target.value; ui.page = ""; render(); });
	$("page").addEventListener("change", (e) => { ui.page = e.target.value; render(); });
	$("onlyChanged").addEventListener("click", (e) => { ui.onlyChanged = !ui.onlyChanged; e.target.setAttribute("aria-pressed", String(ui.onlyChanged)); render(); });
	$("factsOnly").addEventListener("click", (e) => { ui.factsOnly = !ui.factsOnly; ui.touched.clear(); e.target.setAttribute("aria-pressed", String(ui.factsOnly)); render(); });
	$("showDeleted").addEventListener("click", (e) => { ui.showDeleted = !ui.showDeleted; e.target.setAttribute("aria-pressed", String(ui.showDeleted)); render(); });
	$("expandAll").addEventListener("click", () => { ui.collapsed.clear(); for (const a of Object.keys(stateAt(ui.seq).blocks)) ui.touched.add(a); render(); });
	document.addEventListener("keydown", (e) => {
		if (e.target.closest && e.target.closest("select, input")) return;
		if (e.key === "ArrowLeft") { step(-1); e.preventDefault(); }
		if (e.key === "ArrowRight") { step(1); e.preventDefault(); }
		if (e.key === "Home") go(commits[0].seq);
		if (e.key === "End") go(commits[commits.length - 1].seq);
	});
	render();
}

init();
</script>
