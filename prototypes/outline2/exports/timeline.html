:root {
	--bg: #f5f6fb;
	--panel: #ffffff;
	--fg: #1b1e2d;
	--muted: #5c6180;
	--line: #dde0ed;
	--accent: #4b59d0;

	--add: #1d7f47;

	--del: #ab3337;

	--mov: #2c69ab;
	--human: #c2410c;
	--agent: #4b59d0;
	--system: #8a8fa8;
	--font-ui: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
	--font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
	--bar-h: 132px;
}

		--fg: #e3e5f1;

		--line: #2b2e41;
		--accent: #929dff;
		--accent-soft: #262a49;
		--add: #63cf91;
		--add-soft: #15301f;
		--chg: #e8b54e;
		--chg-soft: #33290f;
		--del: #f07c7f;
		--del-soft: #3a1a1c;
		--mov: #80b5ee;
		--human: #f59f68;
		--agent: #929dff;
		--system: #6c7191;
		color-scheme: dark;
	}
}
:root[data-theme="dark"] {
	--bg: #11131b;
	--panel: #191b27;
	--fg: #e3e5f1;
	--muted: #9a9fbc;
	--line: #2b2e41;
	--accent: #929dff;
	--accent-soft: #262a49;

}
* { box-sizing: border-box; }
body {
	background: var(--bg);
	color: var(--fg);
	font-family: var(--font-ui);
	font-size: 14px;
	line-height: 1.55;
	padding-left: max(16px, env(safe-area-inset-left, 0px));
	padding-right: max(16px, env(safe-area-inset-right, 0px));
	padding-block: 20px calc(var(--bar-h) + 24px + env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 16px; }
header { display: grid; gap: 10px; }
h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; max-width: 65ch; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-variant-numeric: tabular-nums; color: var(--muted); }
.stats b { color: var(--fg); font-weight: 600; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.controls label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
select, button, input[type="search"] {
	font: inherit;
	color: var(--fg);
	background: var(--panel);
	border: 1px solid var(--line);
	border-radius: 6px;
	padding: 4px 10px;
}
select { max-width: 100%; text-overflow: ellipsis; }
.controls label { min-width: 0; max-width: 100%; }
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
@media (max-width: 880px) { .main { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.panel h2 { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: var(--muted); margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.tree { padding: 8px 6px 12px; overflow-x: auto; }
.page + .page { border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 6px; }
.node { min-width: 0; }
.row { display: grid; grid-template-columns: 18px 14px minmax(0, 1fr); gap: 4px; align-items: start; padding: 2px 8px 2px 4px; border-radius: 5px; }
.row.add { background: var(--add-soft); }
.row.chg { background: var(--chg-soft); }
.row.del { background: var(--del-soft); }
.row.del .text { text-decoration: line-through; color: var(--muted); }
.mark { font-family: var(--font-mono); font-size: 12px; text-align: center; line-height: 22px; }
.row.add .mark { color: var(--add); }
.row.chg .mark { color: var(--chg); }
.row.del .mark { color: var(--del); }
.row.mov .mark { color: var(--mov); }
.toggle { border: 0; background: none; padding: 0; width: 14px; height: 22px; color: var(--muted); font-size: 11px; line-height: 22px; }
.toggle:disabled { cursor: default; opacity: 0.35; }
.body { min-width: 0; display: grid; gap: 2px; }
.line1 { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
.addr { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.text { white-space: pre-wrap; overflow-wrap: anywhere; }
.text.multi { font-family: var(--font-mono); font-size: 12px; display: block; width: 100%; }
.chips { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 11px; line-height: 18px; padding: 0 6px; border-radius: 9px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.alias { border-color: var(--accent); color: var(--accent); font-family: var(--font-mono); }
.chip.st-doing { color: var(--accent); border-color: var(--accent); }
.chip.st-done { color: var(--add); border-color: var(--add); }
.chip.st-blocked, .chip.st-submitted { color: var(--chg); border-color: var(--chg); }
.chip.st-cancelled { text-decoration: line-through; }
.chip.stance-accepted { color: var(--add); border-color: var(--add); }
.chip.stance-refuted { color: var(--del); border-color: var(--del); }
.chip.approved { color: var(--human); border-color: var(--human); }
.chip.live { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.tick.proc { opacity: 0.18; height: 6px !important; }
.fold { color: var(--muted); font-size: 12px; padding: 1px 0 3px 40px; }
.links { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.kids { margin-left: 18px; border-left: 1px solid var(--line); padding-left: 4px; }
.detail { padding: 12px 14px; display: grid; gap: 10px; }
.detail .who { font-weight: 600; }
.detail .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.ops { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13px; }
.ops li { overflow-wrap: anywhere; }
.empty { color: var(--muted); padding: 12px 14px; }
.bar {
	position: fixed;
	left: 0;
	right: 0;
	bottom: 0;
	background: var(--panel);
	border-top: 1px solid var(--line);
	padding-left: max(16px, env(safe-area-inset-left, 0px));
	padding-right: max(16px, env(safe-area-inset-right, 0px));
	padding-block: 8px calc(10px + env(safe-area-inset-bottom, 0px));
	z-index: 5;
}
.bar-in { max-width: 1180px; margin: 0 auto; display: grid; gap: 6px; }
.ticks { display: flex; align-items: flex-end; gap: 2px; height: 46px; overflow-x: auto; padding-bottom: 2px; }
.tick { flex: 1 0 6px; max-width: 26px; border: 0; padding: 0; border-radius: 2px 2px 0 0; background: var(--system); opacity: 0.55; cursor: pointer; }
.tick.human { background: var(--human); }
.tick.agent { background: var(--agent); }
.tick.past { opacity: 0.9; }
.tick.cur { opacity: 1; outline: 2px solid var(--fg); outline-offset: 1px; }
.tick.base { box-shadow: inset 0 -4px 0 var(--chg); }
.tick.flag { border-top: 3px solid var(--chg); }
input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
.bar-row { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: space-between; }
.bar-row .left, .bar-row .right { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.now { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.now b { color: var(--fg); }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="wrap">
	<header>
		<h1>大纲时间机器（第二版）</h1>
		<p class="sub">拖动底部的时间轴，看大纲在每一个提交时的样子。高亮的是这一步（或从对照点到现在）发生的变化。默认只看事实：任务和它下面的内容是过程，收成事实上的「进行中」标记；时间轴也只走改到事实的提交。</p>
		<div class="stats" id="stats"></div>
		<div class="controls">
			<label for="space">空间 <select id="space"></select></label>
			<label for="page">页 <select id="page"></select></label>
			<button type="button" id="factsOnly" aria-pressed="true">只看事实</button>
			<button type="button" id="onlyChanged" aria-pressed="false">只看有变化的分支</button>
			<button type="button" id="showDeleted" aria-pressed="false">显示已删除</button>
			<button type="button" id="expandAll">全部展开</button>
		</div>
		<div class="legend" aria-hidden="true">
			<span><i class="sw" style="background: var(--add)"></i>新增</span>
			<span><i class="sw" style="background: var(--chg)"></i>修改</span>
			<span><i class="sw" style="background: var(--del)"></i>删除</span>
			<span><i class="sw" style="background: var(--mov)"></i>移动</span>
			<span><i class="sw" style="background: var(--human)"></i>人的提交</span>
			<span><i class="sw" style="background: var(--agent)"></i>agent 的提交</span>
			<span><i class="sw" style="background: var(--system)"></i>系统提交</span>
		</div>
	</header>
	<div class="main">
		<section class="panel" aria-label="大纲">
			<h2 id="treeTitle">大纲</h2>
			<div class="tree" id="tree"></div>
		</section>
		<aside class="panel" aria-label="这次提交">
			<h2>这次提交</h2>
			<div class="detail" id="detail"></div>
		</aside>
	</div>
</div>

<div class="bar" role="region" aria-label="时间轴">
	<div class="bar-in">
		<div class="ticks" id="ticks"></div>
		<label for="seq" class="now" id="now"></label>
		<input type="range" id="seq" min="1" max="1" value="1">
		<div class="bar-row">
			<div class="left">
				<button type="button" id="first" aria-label="第一个提交">⏮</button>
				<button type="button" id="prev" aria-label="上一个提交">◀</button>
				<button type="button" id="play" aria-pressed="false">播放</button>
				<button type="button" id="next" aria-label="下一个提交">▶</button>
				<button type="button" id="last" aria-label="最新">⏭</button>
			</div>
			<div class="right">
				<button type="button" id="pin">把这里设为对照点</button>
				<button type="button" id="unpin" hidden>取消对照</button>
			</div>
		</div>
	</div>
</div>

p/TMdwYNRd", "order": 4.0, "kind": "note", "content": "需要人能记住的稳定别名（D1、P0、路线图）：随机短 id 只适合机器，人和 agent 在对话里都用别名", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/kJThz9Os", "space": "p", "parent": "p/TMdwYNRd", "order": 5.0, "kind": "note", "content": "「某样东西不存在」这类结论锚不到符号上（比如仓库里没有向量代码），需要「检索锚点」：记下一个检索和它的结果集，结果变了就存疑", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/PoBH5Bog", "space": "p", "parent": "p/TMdwYNRd", "order": 6.0, "kind": "note", "content": "锚点要能指向非声明的位置（数组里的一项、配置对象的一个键）；原型用检索锚点兜底，正式版要支持结构路径或行范围", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/AKv45oAj", "space": "p", "parent": "p/TMdwYNRd", "order": 7.0, "kind": "note", "content": "D1 的「单次改动超过 50 个块」应该只数改动已有的块；一次新建很多块不碰别人的内容，不算大改动", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/b4NURQO1", "space": "p", "parent": "p/TMdwYNRd", "order": 8.0, "kind": "note", "content": "已批准的计划里，只有任务才算步骤：在步骤下写笔记、断言是记录进展，不算改计划。契约 = 计划根 + 根下直接挂着的非任务块", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/PH5Odq0r", "space": "p", "parent": "p/TMdwYNRd", "order": 9.0, "kind": "note", "content": "变更请求只让被改的那一步受阻；新增步骤不影响已有步骤，不该让整份计划停下", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/AGjS85c8", "space": "p", "parent": "p/TMdwYNRd", "order": 10.0, "kind": "note", "content": "获授权的 agent 自己改已批准的计划，也要走变更请求、由别人来批，否则「代批」就成了绕过", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/CevSO7EI", "space": "p", "parent": "p/TMdwYNRd", "order": 11.0, "kind": "note", "content": "人确认个人空间的提议时，确认本身就是证据，被确认的断言应直接采纳", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/wfB9Zsos", "space": "p", "parent": "p/TMdwYNRd", "order": 12.0, "kind": "note", "content": "计划根完成时还有子任务没做完：提示但不阻止，结项时它们成为遗留", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/gCpTvLbi", "space": "p", "parent": "p/TMdwYNRd", "order": 13.0, "kind": "note", "content": "管理者应该沿任务子树继承：路线图归负责人管，它下面 agent 建的步骤也归负责人管", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/PllM72C8", "space": "p", "parent": "p/TMdwYNRd", "order": 14.0, "kind": "note", "content": "对话里做出的决定没有稳定地址：原型只能写「chat:日期 + 原话」；正式版里应该指向 msg: 消息 id", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/6hhSPqRU", "space": "p", "parent": "p/TMdwYNRd", "order": 15.0, "kind": "note", "content": "写检索锚点时，正则里的反斜杠会被参数解析吃掉；agent 写锚点需要不依赖转义的写法", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/CQhWv1YD", "space": "p", "parent": "p/a4bsGcVR", "order": 1.0, "kind": "note", "content": "六个概念：块、类型、链接、空间、提交、层。详见 docs/OUTLINE_KNOWLEDGE-DESIGN.md §2", "props": {}, "author": "agent:main"}, {"op": "block.create", "addr": "p/ay8D5pME", "space": "p", "parent": "p/a4bsGcVR", "order": 2.0, "kind": "note", "content": "九条规则", "props": {}, "author": "agent:main"}, {"op": "block.create", "addr": "p/JNYdq1NP", "space": "p", "parent": "p/TMdwYNRd", "order": 16.0, "kind": "note", "content": "看板要区分「可以开始」和「等前置」：前置没完成的任务看起来和普通待办一样；原型改为推导出「等前置」标记，不写进状态", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/wJsEdT5n", "space": "p", "parent": "p/TMdwYNRd", "order": 17.0, "kind": "note", "content": "工具输出里要直接给出数量（检查了几处锚点、改了几个块），agent 凭记忆写数字容易写错：录入时把 13 处锚点写成了 15，见第 15 个提交的更正", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/CZyp6nnF", "space": "p", "parent": "p/Pa320SYM", "order": 17.0, "kind": "note", "content": "D16 系统要支持派「没有什么约束」的专注 agent 集中攻坚，由遵循规则的协调 agent 帮它们记账、处理规则", "props": {"alias": "D16", "tags": ["决策"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/OdnlnA0S", "space": "p", "parent": "p/5N6EK3Bl", "order": 17.5, "kind": "task", "content": "表格是否正式进块体？设计文档已把表格写进块体，但标着「表格待定」（§7.7）；单元格里能不能换行（docs 样本里唯一的 HTML `<br>` 全用在表格里）？见原型发现 [[p/8ufzzqLQ]]", "props": {"status": "todo", "assignee": "human:owner", "manager": "agent:main", "alias": "Q17", "question": true, "tags": ["P0"]}, "author": "agent:steward"}, {"op": "block.create", "addr": "p/4Z6Wizxz", "space": "p", "parent": "p/5N6EK3Bl", "order": 17.75, "kind": "task", "content": "提及 `[[…]]` 怎么写：存短 id 还是别名（人和 agent 都用别名，原型正文里存的就是别名，见 [[p/bBLXUFIK]]）？同一空间内要不要省略前缀？会话空间的块怎么写绝对地址（`s` 指「本会话」，随读者变，不能直接存）？要不要支持 `|显示文本`？", "props": {"status": "todo", "assignee": "human:owner", "manager": "agent:main", "alias": "Q18", "question": true, "tags": ["P0"]}, "author": "agent:steward"}, {"op": "block.create", "addr": "p/Gg3kqVYm", "space": "p", "parent": "p/5N6EK3Bl", "order": 17.875, "kind": "task", "content": "嵌入 `![[…]]` 做成行内节点（设计文档 §7.7 现在这么写），还是只能独占一块？", "props": {"status": "todo", "assignee": "human:owner", "manager": "agent:main", "alias": "Q19", "question": true, "tags": ["P0"]}, "author": "agent:steward"}, {"op": "block.create", "addr": "p/mrNkT2jT", "space": "p", "parent": "p/5N6EK3Bl", "order": 17.9375, "kind": "task", "content": "块内要不要支持数学和图片？不支持的话写入时就得转义，否则只读视图（MarkdownContent）照样会渲染", "props": {"status": "todo", "assignee": "human:owner", "manager": "agent:main", "alias": "Q20", "question": true, "tags": ["P0"]}, "author": "agent:steward"}, {"op": "block.create", "addr": "p/JsCuWe1O", "space": "p", "parent": "p/5N6EK3Bl", "order": 17.96875, "kind": "task", "content": "段内单换行：保留为软换行（显示成空格），还是统一规范成硬换行？", "props": {"status": "todo", "assignee": "human:owner", "manager": "agent:main", "alias": "Q21", "question": true, "tags": ["P0"]}, "author": "agent:steward"}, {"op": "block.create", "addr": "p/i4dnplQK", "space": "p", "parent": "p/5N6EK3Bl", "order": 17.984375, "kind": "task", "content": "agent 写入列表、多段等方言外的结构时怎么办：拒绝、拆成子块，还是转义成普通文本？", "props": {"status": "todo", "assignee": "human:owner", "manager": "agent:main", "alias": "Q22", "question": true, "tags": ["P0"]}, "author": "agent:steward"}, {"op": "block.create", "addr": "p/iRCYt4KJ", "space": "p", "parent": "p/5N6EK3Bl", "order": 17.9921875, "kind": "task", "content": "块内转义用哪种策略：最小转义（好读，对 agent 写入的改动少，但要对三个解析器做模糊测试），还是 Tiptap 式保守转义（省心，但会把 `snake_case` 这类文本也转义掉）？agent 写反斜杠容易出错，见 [[p/6hhSPqRU]]", "props": {"status": "todo", "assignee": "human:owner", "manager": "agent:main", "alias": "Q23", "question": true, "tags": ["P0"]}, "author": "agent:steward"}, {"op": "block.create", "addr": "p/e4GX76E5", "space": "p", "parent": "p/5N6EK3Bl", "order": 17.99609375, "kind": "task", "content": "标题级别用 1–6 还是 1–3？分隔线要不要做成块体（docs 样本里 `---` 有 135 处）？", "props": {"status": "todo", "assignee": "human:owner", "manager": "agent:main", "alias": "Q24", "question": true, "tags": ["P0"]}, "author": "agent:steward"}, {"op": "block.create", "addr": "p/aygA8oG9", "space": "p", "parent": "p/5N6EK3Bl", "order": 17.998046875, "kind": "task", "content": "任务反思：采纳 Q13 的调研建议吗？建议是不改成可选，等 P2 补齐四个缺口后，把门禁、两个决策工具、`spec_protected_tasks` 和 human attention 里的 task_reflection 一起删掉；还想要模型复核的话，照 §9.7 只在任务上留审查意见，不阻塞，默认关闭", "props": {"status": "todo", "assignee": "human:owner", "manager": "agent:main", "alias": "Q25", "question": true, "tags": ["P2"]}, "author": "agent:steward"}, {"op": "block.create", "addr": "p/E3mTuA2I", "space": "p", "parent": "p/5N6EK3Bl", "order": 17.9990234375, "kind": "task", "content": "`/goal` 建的任务默认按草稿还是按已批准处理？调研建议默认按已批准：`/goal` 是用户在说「务必完成」；按草稿处理时，无人值守的 agent 可以提前标完成、停掉续跑，要等人看看板才会发现（设计文档 §11.4 现在写的是草稿；调研时是 §10.4，插入 §10 后顺延）", "props": {"status": "todo", "assignee": "human:owner", "manager": "agent:main", "alias": "Q26", "question": true, "tags": ["P2"]}, "author": "agent:steward"}, {"op": "block.create", "addr": "p/IQn7U6Pl", "space": "p", "parent": "p/TMdwYNRd", "order": 18.0, "kind": "note", "content": "默认身份是个陷阱：命令不带 --as 时按 agent:main 执行。我开头 21 条读和检索命令没带身份，读取记录全记进了 agent:main 名下，等于替它刷新了「读到的版本」，它之后再改这些块时，并发检查会漏掉别人的修改。这次的块都是 agent:main 自己写的，没造成实际影响。协调者要在三个身份之间切换，没给身份时应该报错，至少在输出里回显当前身份", "props": {"tags": ["发现"]}, "author": "agent:steward"}, {"op": "block.create", "addr": "p/8xOHADRj", "space": "p", "parent": "p/TMdwYNRd", "order": 19.0, "kind": "note", "content": "「代」有两种意思，命令行只显示一种：log 里「agent:w-dialect（代 human:owner）」的「代」指责任人；这次真正的代记人（recorded_by=agent:steward）只写进了 log.jsonl，命令行的 log 和 export 都不显示，只有 viewer.html 显示，读的人会以为是 w-dialect 自己写的。我只好把「steward 代记」写进每条提交消息和协调者笔记。责任人、代批、代记三个「代」，是这次最让我犹豫的概念", "props": {"tags": ["发现"]}, "author": "agent:steward"}, {"op": "block.create", "addr": "p/JxNV7qfA", "space": "p", "parent": "p/TMdwYNRd", "order": 20.0, "kind": "note", "content": "代记时该用谁的身份，没有定下来的规则：报告结论是用专注 agent 的身份加 --by，还是用协调者身份写，只能从 [[p/D16b]]（还是待确认的假设）和 --by 的帮助推断；代码注释说代记见 §8.14，设计文档只到 §8.13。这条我读了好几遍，最后定为：报告里的结论和代交用专注 agent 身份加 --by，提问、看法、发现用 agent:steward", "props": {"tags": ["发现"]}, "author": "agent:steward"}, {"op": "block.create", "addr": "p/wezmydyv", "space": "p", "parent": "p/TMdwYNRd", "order": 21.0, "kind": "note", "content": "agent 写的 [assert] 带了证据，默认也是「假设」，要显式写 [assert:accepted]。README 说「没有依据的结论会被记为假设」，§9.6 说有证据的结论「直接是采纳」，读起来像有证据就会自动采纳；我读了 default_props 才确认，不然这次 30 条有依据的结论会全部记成假设", "props": {"tags": ["发现"]}, "author": "agent:steward"}, {"op": "block.create", "addr": "p/eWnSiDjJ", "space": "p", "parent": "p/TMdwYNRd", "order": 22.0, "kind": "note", "content": "建一条提问要手填五项：alias（先扫一遍已有别名找空号，这次是 Q17–Q26）、owner=human:owner、manager、tags（提问加阶段）、source。manager 默认是创建者，也就是临时的协调者，我手动改成了 agent:main。别名重复不会报错，但两个块都会按别名解析失败（resolve 要求唯一）。这些应该由系统做：提问命令自动编号，管理者和阶段标签随 source 指向的任务继承", "props": {"tags": ["发现"]}, "author": "agent:steward"}, {"op": "block.create", "addr": "p/X2hS0N1J", "space": "p", "parent": "p/TMdwYNRd", "order": 23.0, "kind": "note", "content": "add --md 加 --after 时，只有第一条落在指定位置，其余追加到页尾，在待定问题页会排到「已回答」后面。我读 create_items 时发现了这一点，只好把 10 个提问拆成 10 条命令，每条接在上一条后面", "props": {"tags": ["发现"]}, "author": "agent:steward"}, {"op": "block.create", "addr": "p/VpoFI7PK", "space": "p", "parent": "p/TMdwYNRd", "order": 24.0, "kind": "note", "content": "正文里没法写字面的双中括号：原型在正文任何位置都把它认成提及，行内代码里也一样。代记方言报告时，报告里用真实别名 D5、D6 写的示例会变成真链接，我只好改写成 `[[p/…]]`。这正是 Q6 要回答的转义和提及写法问题（[[p/Q23]]、[[p/Q18]]）", "props": {"tags": ["发现"]}, "author": "agent:steward"}, {"op": "block.create", "addr": "p/FRkh7rVZ", "space": "p", "parent": "p/TMdwYNRd", "order": 25.0, "kind": "note", "content": "代码锚点只认 TS/JS 写法的声明，而且只对照 origin/main：报告引用的 outline.py 常量 INLINE_LINK 和 Python 函数都锚不上，origin/main 上也还没有 prototypes/outline/；按行号引用的位置也锚不上（同 [[p/PoBH5Bog]]）。这些只能写 evidence=file:，过期了看不出来。为了不报错，我先用 Python 预算了 16 个锚点的指纹，确认能算出来才写进去", "props": {"tags": ["发现"]}, "author": "agent:steward"}, {"op": "block.create", "addr": "p/ACeb4kF6", "space": "p", "parent": "p/TMdwYNRd", "order": 26.0, "kind": "note", "content": "报告里的行号在代记前就对不上了：w-dialect 写完报告后，21c0ff6f 改了设计文档，报告里的 OD:438 现在在第 446 行。evidence=file:路径 不带版本，过后没人知道指的是哪一版，我只能在图例里注明「行号按 eeb244b6」。file: 证据应该自动记下当时的提交号，或者像 based_on 一样记指纹", "props": {"tags": ["发现"]}, "author": "agent:steward"}, {"op": "block.create", "addr": "p/uHX4EGi1", "space": "p", "parent": "p/TMdwYNRd", "order": 27.0, "kind": "note", "content": "两份报告放在会话的临时目录里，会话结束就没了，指向它们的 file: 证据会失效。行内写法 {evidence=…} 带不了摘录，只有 task --excerpt 和 link --excerpt 能带，所以只在两次代交时加了摘录。已有的现状盘点用的是 report:spec-inventory-…，两种写法并存。§9.6 说子代理的最终报告应该自动挂到任务下面，现在这一步全靠协调者手抄，这次抄了 53 个块", "props": {"tags": ["发现"]}, "author": "agent:steward"}, {"op": "block.create", "addr": "p/WSjnydef", "space": "p", "parent": "p/TMdwYNRd", "order": 28.0, "kind": "note", "content": "read 和 board 看不出任务要不要验收、管理者是谁，只显示执行者。为了确认 Q6、Q13 要验收、管理者是 agent:main，我只能用 Python 直接加载状态查属性", "props": {"tags": ["发现"]}, "author": "agent:steward"}, {"op": "block.create", "addr": "p/xetsZBvn", "space": "p", "parent": "p/TMdwYNRd", "order": 29.0, "kind": "note", "content": "调研型提问做完以后，没有把建议交给负责人拍板的环节：Q13 本身就是「是否保留」的提问，调研完进入待验收、由 agent:main 验收，负责人的收件箱里看不到。我另建了 [[p/Q25]] 请负责人决定，但拿不准它算不算和 Q13 重复；[[p/i5q1KUdz]] 只说「形成决策后链接到设计决策」，没说由谁发起", "props": {"tags": ["发现"]}, "author": "agent:steward"}, {"op": "block.create", "addr": "p/a9JvCq6q", "space": "p", "parent": "p/TMdwYNRd", "order": 30.0, "kind": "note", "content": "add --md 会静默丢掉空行：代码块里的空行会丢；表格后面也没法另起一段，因为 GFM 会把紧跟的文字并进表格，所以我把方言草案的缩写说明放进了子块", "props": {"tags": ["发现"]}, "author": "agent:steward"}, {"op": "block.create", "addr": "p/oDcGZOLZ", "space": "p", "parent": "p/TMdwYNRd", "order": 31.0, "kind": "note", "content": "步数：到这一条为止执行了 57 条 outline 命令，没有报错。其中写入 18 条：代记内容 2 条（53 个块）、提问 10 条、Q10 补充 1 条、协调者笔记 2 条、代交 2 条、这一批发现 1 条；其余 39 条是帮助、读页、检索和核对。不报错的代价是先读了 outline.py 全文约 1900 行里的约 1600 行，又用 git、Python、curl 做了近 20 次只读核对（锚点指纹、文件路径、设计文档版本、任务属性）。纯记账的部分有别名编号、提问的五项属性、提问索引笔记、代交、核对位置和收件箱，大多可以由系统自动做", "props": {"tags": ["发现"]}, "author": "agent:steward"}, {"op": "block.create", "addr": "p/5nB0TYwk", "space": "p", "parent": "p/BUvPjg55", "order": 8.0, "kind": "task", "content": "核实：在 SpecMarkdownEditor 里编辑含表格的 spec 文件并保存，表格会不会丢；属实就给出修复方案（来自 Q6 调研的顺带发现 [[p/f3TO9Yre]]）", "props": {"status": "done", "assignee": "agent:w-table", "manager": "agent:main", "tags": ["核实"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/S7dMgVAI", "space": "p", "parent": "p/Pa320SYM", "order": 18.0, "kind": "note", "content": "D17 一个会话能同时管多个工作区（多台设备上的目录、多个仓库）；agent 在全局的大网上有几个「泡」作为注意范围，泡外的内容也可以适当查看；主 agent 或人批准下级改变范围", "props": {"alias": "D17", "tags": ["决策"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/e4NgxR0k", "space": "p", "parent": "p/TMdwYNRd", "order": 32.0, "kind": "note", "content": "章节号引用会随文档重排失效：设计文档插入 §10 之后，大纲里引用设计文档章节号的 13 处有 3 处指错了（[[p/7QQgsP3M]]、[[p/Q26]]、[[p/1wEcDyvj]]，已改）；写明提交号的 [[p/7rCR5pnr]]（「设计文档 21c0ff6f……§18」）仍然准确。正式系统里设计文档本身就在大纲里，引用是块链接，重排不会断；迁移期间引用外部文档，要像 file: 证据一样记下版本", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/LRzBRVNS", "space": "p", "parent": "p/TMdwYNRd", "order": 33.0, "kind": "note", "content": "范围页上的泡本来可以用普通的 link 命令直接加，等于自己扩大范围、绕过批准；原型改成范围页上的「涉及」只能用 scope 命令增减。正式系统里，决定范围和权限的链接不能走通用的写链接路径", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/QNztNKwM", "space": "p", "parent": "p/TMdwYNRd", "order": 34.0, "kind": "note", "content": "同一个泡会攒出好几条扩大范围请求：agent 被挡住时系统替它提一条，它自己再申请一条，上级替它申请又是一条。原型里批准其中一条之后，其余只要范围、而且已经满足的请求由系统关掉（状态 satisfied），不留给人处理", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/Xu6k5OQ3", "space": "p", "parent": "p/TMdwYNRd", "order": 35.0, "kind": "note", "content": "带期限的授权，期限要从批准时算起：请求可能排队很久，从提出时算，授权时间会耗在等待上", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/IkoZqV55", "space": "p", "parent": "p/TMdwYNRd", "order": 36.0, "kind": "note", "content": "范围一旦建立就是白名单：原来不受限的 agent 只要有了第一个泡，泡外的写入就都要申请。所以「执行」不能单独作为第一个泡，只申请一台设备的执行，会顺带把它在大纲上的写入都锁住。正式系统里，会话的主工作区和它所属项目的空间应当默认就是泡，额外的工作区和区域才需要申请", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/CHZaxTxI", "space": "p", "parent": "p/TMdwYNRd", "order": 37.0, "kind": "note", "content": "「建议」不能按普通断言的默认立场处理：有证据的断言默认采纳，但建议在负责人采纳之前不该是采纳。原型里写建议时显式标成假设，answer 采纳时再改成采纳；正式系统里可以让建议成为提问下的一种块，立场由回答决定", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/5oXqgL87", "space": "p", "parent": "p/TMdwYNRd", "order": 38.0, "kind": "note", "content": "agent 从命令输出里抠地址容易抠错：行首的 [地址] 和正文里的 [[提及]] 长得一样。我用 sed 取新任务的地址，取到了正文里提及的块，给专注 agent 圈错了泡（#55，#59 改回）。正式工具的返回值要结构化，新建的块单独给出地址", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/oN5wEBog", "space": "p", "parent": "p/TMdwYNRd", "order": 39.0, "kind": "note", "content": "报告挂回能用：两份报告分别转成 45 和 53 个块，表格、嵌套列表、「**样本**」这类标签段落下的列表都落在该在的位置；12 条指向临时文件的证据改指到挂好的块（[[p/4LKK4aHV]]、[[p/MwhYZUvK]]）", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/jrRCI1E3", "space": "p", "parent": "p/5N6EK3Bl", "order": 17.99951171875, "kind": "task", "content": "Spec 文件以什么方式编辑：继续以所见即所得为主（补上表格、任务列表、图片扩展，长期保留检测），还是改成源码优先、所见即所得可选（像文件编辑器的 raw / split / preview）？", "props": {"status": "todo", "assignee": "human:owner", "manager": "agent:main", "alias": "Q27", "question": true}, "author": "agent:main"}, {"op": "block.create", "addr": "p/DszXEDMJ", "space": "p", "parent": "p/5N6EK3Bl", "order": 17.999755859375, "kind": "task", "content": "检测到编辑器保不住的语法（表格、HTML、图片、任务列表、脚注、front matter）时怎么处理：禁止在所见即所得里保存、改成只读并提供源码按钮，还是只弹确认框？", "props": {"status": "todo", "assignee": "human:owner", "manager": "agent:main", "alias": "Q28", "question": true}, "author": "agent:main"}, {"op": "block.create", "addr": "p/FUd5vw6c", "space": "p", "parent": "p/5N6EK3Bl", "order": 17.9998779296875, "kind": "task", "content": "Tiptap 版本：整套 @tiptap/* 升到 3.32.0（修好单元格里竖线转义和 `<br>`，但要回归 InlineComposerEditor 输入框），还是留在 3.27.1、自己覆盖 Table 的 renderMarkdown 补竖线转义？见 [[p/9K1u88rW]]", "props": {"status": "todo", "assignee": "human:owner", "manager": "agent:main", "alias": "Q29", "question": true}, "author": "agent:main"}, {"op": "block.create", "addr": "p/2npkqyKh", "space": "p", "parent": "p/5N6EK3Bl", "order": 17.99993896484375, "kind": "task", "content": "非 .md 的 spec 文件（agent 建的 .json、.yaml 等）和 behavior_fence，是否一律改用纯文本编辑？", "props": {"status": "todo", "assignee": "human:owner", "manager": "agent:main", "alias": "Q30", "question": true}, "author": "agent:main"}, {"op": "block.create", "addr": "p/aPJZmbvr", "space": "p", "parent": "p/5N6EK3Bl", "order": 17.999969482421875, "kind": "task", "content": "数据恢复：要不要做 spec 的历史查看和恢复功能？要不要先离线排查一遍现有数据库里被 UI 保存吞掉表格的记录？", "props": {"status": "todo", "assignee": "human:owner", "manager": "agent:main", "alias": "Q31", "question": true}, "author": "agent:main"}, {"op": "block.create", "addr": "p/exPd2lFV", "space": "p", "parent": "p/TMdwYNRd", "order": 40.0, "kind": "note", "content": "verify 被转成请求时，输出前后矛盾：先说「已转成扩大范围请求 CR3」，紧接着又打印「已复核 p/f3TO9Yre：fresh」，读起来像已经生效；实际块还是「假设·待决定：CR3」。被转出去的命令应该只报请求，不报结果", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/2HJvJjrd", "space": "p", "parent": "p/TMdwYNRd", "order": 41.0, "kind": "note", "content": "verify 的 --note 不在请求里：CR3 只有「涉及」链接、证据链接和 stance=accepted 三个操作，我写的复核意见（没在真浏览器里点、丢表格和 DOM 无关）不见了。不读源码没法知道批准后会不会补上，只好在任务下另写一条协调者笔记（[[p/60fYKsDg]]）。另外，复核成立后，正文里「这是读源码推断的，没在浏览器里实测」会原样变成采纳的断言；用 fresh 不会提示改写，用 update 又像是结论本身要改，README 没说这种情况选哪个", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/OcqvZ54e", "space": "p", "parent": "p/TMdwYNRd", "order": 42.0, "kind": "note", "content": "cr show 看不出转出去的写入写得对不对：CR2 列了新块的地址、正文和链接，但不显示属性（alias=Q? 会编成几号、执行者、管理者、标签、立场）和插入位置（--after p/Q26）。提问是不是排在「已回答」前面、建议是不是假设，要等 agent:main 批准后才知道，写错了也只能批准后再改", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/R5VvXWTt", "space": "p", "parent": "p/TMdwYNRd", "order": 43.0, "kind": "note", "content": "同一个泡攒了两条带操作的请求：CR2（建提问）和 CR3（复核）都要把待定问题页以「修改」纳入我的范围。[[p/QNztNKwM]] 说批准一条之后，其余「只要范围、已经满足」的请求由系统关掉；CR3 带着自己的操作，批准 CR2 之后它会被关掉（复核丢失）、自动执行，还是继续等决定，README 没写", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/ZFWs7gMs", "space": "p", "parent": "p/TMdwYNRd", "order": 44.0, "kind": "note", "content": "代记时按谁的范围判断没写：README 说 --as 是作者、--by 是代记人，但没说泡内泡外看作者（agent:w-table 的泡只有这个任务）还是代记人（agent:steward2 的泡是整个 spec 现状页）。这次写在任务下的内容两人的泡都覆盖，看不出来。提问我改用自己的身份写，免得批准后扩大的是已经收工的 w-table 的范围", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/alIh4NqM", "space": "p", "parent": "p/TMdwYNRd", "order": 45.0, "kind": "note", "content": "提问和下面的建议只能用同一个身份写：建议是 w-table 报告的倾向，按代记规则应该算 w-table 的；但提问在泡外，整批转成 CR2，新块要批准后才存在，没法先建提问、再换 w-table 的身份在下面补建议，只好在建议正文里写明「agent:w-table 报告的倾向」。README 只说报告里的「结论」用专注 agent 的身份加 --by，没说报告里要人决定的点和倾向怎么记", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/53C4gjE1", "space": "p", "parent": "p/TMdwYNRd", "order": 46.0, "kind": "note", "content": "task 的动作要猜：README 只写了 start、block、done、accept，task -h 还列了 submit、revise、cancel、reopen，都没有说明；需验收的任务用 done 是进待验收还是直接完成，也没写。我看了上一轮的 diff 36 37（doing → submitted）才决定用 submit", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/EAX0Hwa5", "space": "p", "parent": "p/TMdwYNRd", "order": 47.0, "kind": "note", "content": "帮助里没有属性和取值：add -h、set -h、ls -h 只有参数名，不列属性键（alias、owner、manager、tags）和类型、状态、立场的取值。manager 这个键 README 里一次也没出现，我是从上一轮的发现 [[p/eWnSiDjJ]] 里看到的。输出显示中文（假设、待验收），过滤却要英文：ls --stance 假设 什么也查不到，--stance hypothesis 才行，而 README 里只出现过 accepted", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/5460okFI", "space": "p", "parent": "p/TMdwYNRd", "order": 48.0, "kind": "note", "content": "同一角色写多条链接的写法没写：README 的例子每行只有一个 based_on、一个 evidence。我在花括号里重复写 based_on=…、evidence=…，读回来都在（[[p/mTbiTmRJ]] 有 5 个基于）；这是试出来的，应该写进 README", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/GzzDzTKS", "space": "p", "parent": "p/TMdwYNRd", "order": 49.0, "kind": "note", "content": "attach 对段落和列表之间的空行敏感：README 说「紧跟在段落后面的列表挂在那个段落下面」。w-dialect 的报告里「**路径缩写**」下一行就是列表，挂成了子块；w-table 的报告按常见写法在标签段落和列表之间空一行，「补充三点：」「**版本**」「**脚本**」「**原因**」后面的列表就都成了兄弟块（[[p/YBQH5ZDL]]）。在 Markdown 里有没有这个空行是同一个结构，挂回的结果不该不同", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/wv7gCwbn", "space": "p", "parent": "p/TMdwYNRd", "order": 50.0, "kind": "note", "content": "复现输出没有好去处：w-table 的复现脚本和输出存档在会话临时目录，我按要求用 file: 作证据，每条链接都提示一次「在仓库之外……报告类文件请先用 attach 放进大纲」（3 个文件提示了 6 次）；可它们不是报告，attach 只收 markdown 报告，会话结束后这些证据只剩指纹。证据类的附件需要一个能存进大纲的地方", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/Jp1WgEIU", "space": "p", "parent": "p/TMdwYNRd", "order": 51.0, "kind": "note", "content": "锚点对照的版本要自己核对：based_on 默认按 origin/main 记指纹，报告却是按工作区读的代码，而这个仓库的工作区和 origin/main 已经分叉（HEAD 落后 60 个提交、领先 15 个）。add 不提示被引用的文件两边是否一致，我用 git diff 逐个核对了被引用的文件（只有 schema.ts 不同，且不在 specFileRevisions 那段）。写完后 fresh 只报「44 处锚点全部新鲜」，看不出新加的 13 处 based_on 有没有被记上（其中有对象方法 writeSpecFileRevision 和检索锚点），也不能用 --under 只查自己写的", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/csjqCZAm", "space": "p", "parent": "p/TMdwYNRd", "order": 52.0, "kind": "note", "content": "「关注」级别的页读起来和能写的页一样：待定问题页在我的泡里是「关注」，read 时没有任何提示；只有完全在泡外的「原型发现」页才显示「范围外……要在这里写，会转成扩大范围请求」。我是先看了 scope show 才知道写提问会被转出去", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/EaZ7Aeeq", "space": "p", "parent": "p/TMdwYNRd", "order": 53.0, "kind": "note", "content": "小问题：log -n 35 接 head 会抛 BrokenPipeError 的 Python 调用栈；log 只有 -n（最近 N 条）和 --under，看不了中间一段（比如第 50 到 61 个提交），只能多取再截", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/ksGzonZJ", "space": "p", "parent": "p/TMdwYNRd", "order": 54.0, "kind": "note", "content": "步数：到这一条为止执行了 57 条 outline 命令，1 条报错（log 接 head 时的 BrokenPipeError，是我加管道引起的），没有命令被拒绝。其中帮助 17 条；写入 7 次，直接生效 4 次（挂报告 151 块、代记 10 条断言、代交、协调者笔记），转成请求 3 次（CR2：5 条提问、3 条建议、1 条参考；CR3：复核；CR4：这批发现）；其余 33 条是读页、范围、日志、diff、看板、ls、cr、收件箱和 fresh（fresh 重复跑了 2 次）。读的文档：README 全文和 16 个子命令的 -h；没有读 outline.py，也没有读 data/log.jsonl。另外用 git、grep、sed 做了 17 次只读核对（报告目录、被引用的产品源码、node_modules 里的 Tiptap 源码、复现输出、两份报告的空行），其中 2 次是我自己写错了路径或参数。README 这次写对、我验证到的：有依据的断言直接采纳，只带出处的是假设，显式立场优先，行内代码里的反斜杠原样保留，报告挂回后表格和代码块完整", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/CJxh3m7M", "space": "p", "parent": "p/TMdwYNRd", "order": 55.0, "kind": "note", "content": "转成请求的批量写入，批准时丢了插入位置：第二轮的 Q27–Q31 落到了「已回答」后面，只好手动挪回去（#91–#95）。原型改成在请求里记下要接在谁后面，批准时照原位插；cr show 也显示出来，批准前能检查", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/dMypdGwK", "space": "p", "parent": "p/TMdwYNRd", "order": 56.0, "kind": "note", "content": "Python 代码锚点原来只取到 def 那一行：取范围的办法是配平括号，而 Python 的括号在签名那一行就配平了，函数体怎么改都不会存疑。改成按缩进取整个函数或类。真实日志里还没有 Python 锚点，没有受影响；正式系统用 tree-sitter 取结构，不会有这个问题，但「锚点覆盖到哪」要有测试", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/J0Wts4Pj", "space": "p", "parent": "p/TMdwYNRd", "order": 57.0, "kind": "note", "content": "复现脚本和输出也要挂回大纲：专注 agent 的证据大多是临时目录里的脚本输出，报告挂回之后，这些 file: 证据仍然悬空（12 条）。原型的 attach 改成也收非 markdown 文件，整个放进代码块，指向它们的证据跟着改指；第二轮的 3 份输出和 6 个脚本都挂在任务下了", "props": {"tags": ["发现"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/v0Y4L01Z", "space": "p", "parent": "p/eD06Kd6H", "order": 1.0, "kind": "note", "content": "一个统一平台：全局知识、个人知识和偏好、工程规格、任务放在同一套东西里", "props": {"alias": "R1"}, "author": "agent:main"}, {"op": "block.create", "addr": "p/AeNKokNq", "space": "p", "parent": "p/eD06Kd6H", "order": 2.0, "kind": "note", "content": "完全替代现在的 spec:// 和知识库", "props": {"alias": "R2"}, "author": "agent:main"}, {"op": "block.create", "addr": "p/CCTKdsXK", "space": "p", "parent": "p/eD06Kd6H", "order": 3.0, "kind": "note", "content": "支撑这些场景：新项目起草、老项目探索并建立完整图谱、新需求开拓、修 bug、多路径探索最后只留一条、coding 之外的项目管理", "props": {"alias": "R3"}, "author": "agent:main"}, {"op": "block.create", "addr": "p/g9j8eQO6", "space": "p", "parent": "p/eD06Kd6H", "order": 4.0, "kind": "note", "content": "像 Obsidian 的大纲笔记：层级不限，内容双向关联", "props": {"alias": "R4"}, "author": "agent:main"}, {"op": "block.create", "addr": "p/eqijJeep", "space": "p", "parent": "p/eD06Kd6H", "order": 5.0, "kind": "note", "content": "在一处直接看到、编辑别处的内容（「传送门」）", "props": {"alias": "R5"}, "author": "agent:main"}, {"op": "block.create", "addr": "p/nMnXszsT", "space": "p", "parent": "p/eD06Kd6H", "order": 6.0, "kind": "note", "content": "把散在各处的内容拼成一个视图（「定制拼接视图」）", "props": {"alias": "R6"}, "author": "agent:main"}, {"op": "block.create", "addr": "p/IatQMchH", "space": "p", "parent": "p/eD06Kd6H", "order": 7.0, "kind": "note", "content": "查看时底部有时间轴，快速浏览图谱随时间的变化", "props": {"alias": "R7"}, "author": "agent:main"}, {"op": "block.create", "addr": "p/5sdrf2lp", "space": "p", "parent": "p/eD06Kd6H", "order": 8.0, "kind": "note", "content": "数据库是唯一真相源；永远不以 markdown 文件为真相源，永远不和 Obsidian vault 双向同步", "props": {"alias": "R8"}, "author": "agent:main"}, {"op": "block.create", "addr": "p/0mFu83NI", "space": "p", "parent": "p/eD06Kd6H", "order": 9.0, "kind": "note", "content": "多人实时同时编辑同一个块", "props": {"alias": "R9"}, "author": "agent:main"}, {"op": "block.create", "addr": "p/epyDKpqL", "space": "p", "parent": "p/eD06Kd6H", "order": 10.0, "kind": "note", "content": "为大纲文档设计的编辑器，可以重写或深度定制，不是每块一个编辑器", "props": {"alias": "R10"}, "author": "agent:main"}, {"op": "block.create", "addr": "p/Km4p5Bc8", "space": "p", "parent": "p/eD06Kd6H", "order": 11.0, "kind": "note", "content": "agent 直接写入，不经过暂存再合并", "props": {"alias": "R11"}, "author": "agent:main"}, {"op": "block.create", "addr": "p/1OEwmafN", "space": "p", "parent": "p/eD06Kd6H", "order": 12.0, "kind": "note", "content": "接入 embedding 和 rerank，让 agent 检索得更准", "props": {"alias": "R12"}, "author": "agent:main"}, {"op": "block.create", "addr": "p/b7AWtEqV", "space": "p", "parent": "p/eD06Kd6H", "order": 13.0, "kind": "note", "content": "这套模型真正服务于多 agent 协作", "props": {"alias": "R13"}, "author": "agent:main"}, {"op": "block.create", "addr": "p/e1ewatDO", "space": "p", "parent": "p/eD06Kd6H", "order": 14.0, "kind": "note", "content": "agent 按大纲做事并及时更新大纲，同时保留自由自主，不过度防御", "props": {"alias": "R14"}, "author": "agent:main"}, {"op": "block.create", "addr": "p/389OyPGR", "space": "p", "parent": "p/eD06Kd6H", "order": 15.0, "kind": "note", "content": "概念和规则不能多到分散注意力、削弱能力", "props": {"alias": "R15"}, "author": "agent:main"}, {"op": "block.create", "addr": "p/XXuPtJS8", "space": "p", "parent": "p/eD06Kd6H", "order": 16.0, "kind": "note", "content": "能派不受约束的子 agent 专心攻坚，由守规则的 agent 帮它协调；攻坚的 agent 要真的专注，不给它加格式", "props": {"alias": "R16"}, "author": "agent:main"}, {"op": "block.create", "addr": "p/ZcjAWDMP", "space": "p", "parent": "p/eD06Kd6H", "order": 17.0, "kind": "note", "content": "支持多语言，不依赖解析自然语言", "props": {"alias": "R17"}, "author": "agent:main"}, {"op": "block.create", "addr": "p/41Dc6svw", "space": "p", "parent": "p/eD06Kd6H", "order": 18.0, "kind": "note", "content": "写计划的人决定严格程度：粗略的草稿随情况改；讨论审批过的严密计划尽量照做，要改先停下来汇报", "props": {"alias": "R18"}, "author": "agent:main"}, {"op": "block.create", "addr": "p/5EcPTW73", "space": "p", "parent": "p/eD06Kd6H", "order": 19.0, "kind": "note", "content": "agent 可以在权限内批准变更，后果最终落到创建人头上", "props": {"alias": "R19"}, "author": "agent:main"}, {"op": "block.create", "addr": "p/nXLq4bR0", "space": "p", "parent": "p/eD06Kd6H", "order": 20.0, "kind": "note", "content": "规划方式重新设计，不再是「一段 md 一个 plan」", "props": {"alias": "R20"}, "author": "agent:main"}, {"op": "block.create", "addr": "p/xmCf5oGa", "space": "p", "parent": "p/eD06Kd6H", "order": 21.0, "kind": "note", "content": "计划完成后滤掉不需要的信息、整理结构，自然成为知识；同时保留当时的计划，供参考和追溯", "props": {"alias": "R21"}, "author": "agent:main"}, {"op": "block.create", "addr": "p/9NRw07bj", "space": "p", "parent": "p/eD06Kd6H", "order": 22.0, "kind": "note", "content": "一个会话原生管多个工作区、多台设备上的目录，用于多服务器联调、多仓库联合开发", "props": {"alias": "R22"}, "author": "agent:main"}, {"op": "block.create", "addr": "p/fX7WsrHR", "space": "p", "parent": "p/eD06Kd6H", "order": 23.0, "kind": "note", "content": "agent 有几块关注区域（「泡」），区域外也能适当查看，保持适配", "props": {"alias": "R23"}, "author": "agent:main"}, {"op": "block.create", "addr": "p/zBHuExWQ", "space": "p", "parent": "p/eD06Kd6H", "order": 24.0, "kind": "note", "content": "主 agent 或人可以批准下级 agent 改变范围", "props": {"alias": "R24"}, "author": "agent:main"}, {"op": "block.create", "addr": "p/EIneKhpg", "space": "p", "parent": "p/eD06Kd6H", "order": 25.0, "kind": "note", "content": "先用 Python 原型承载这次的计划，真实推进，从使用中发现问题", "props": {"alias": "R25"}, "author": "agent:main"}, {"op": "block.create", "addr": "p/SEK5MhWU", "space": "p", "parent": "p/Pa320SYM", "order": 19.0, "kind": "note", "content": "D18 按需求清单收缩概念：六个概念（块、任务、依据、空间、历史、待确认），agent 和人各三条规则，关口只留少数几种，每道关口统计原样通过率", "props": {"alias": "D18", "tags": ["决策"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/cSRo6HMn", "space": "p", "parent": "p/aQdrRFwd", "order": 1.0, "kind": "note", "content": "例外（删除或移动团队之外的人写的块、单次改动超过 50 个已有块）自动转成提议，不打断 agent", "props": {"alias": "D1a", "tags": ["决策", "待确认"]}, "author": "agent:main"}, {"op": "block.create", "addr": "p/NEN9Br1I", "space": "p", "parent": "p/oyRkMECT", "order": 1.0, "kind": "note", "content": "选型：按页建实时会话，一页一
