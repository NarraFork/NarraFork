services:
  narrafork:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${NF_PORT:-7779}:7779"
    volumes:
      # 使用 named volume，不映射宿主机 ~/.narrafork
      # 这样每个容器实例有独立数据，支持 volume snapshot
      - narrafork-data:/root/.narrafork
    environment:
      - NODE_ENV=production
      - PORT=7779
    restart: unless-stopped

volumes:
  narrafork-data:
